name: Market Pro Two Phone - P256 Signed Staff Cloud Read

on:
  push:
    branches:
      - feature/marketpro-two-phone-signed-staff-read
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect-owner-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent production deployments, migrations and Staff auto-activation
        run: |
          set -euo pipefail
          git diff --exit-code 2091cebd2f3966c600f016beb6a4e3ed70b5b921 HEAD -- supabase/migrations/ app/src/main/AndroidManifest.xml web/marketpro-dashboard/
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_PULL_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_READ_PROOF_ENFORCED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_LOGIN_ENABLED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_OUTBOX_AUTO_UPLOAD", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'StaffSignedTeamPullTransport().pull' app/src/main/java/lk/peliyagoda/marketpro/cloud/TeamPullHttpTransport.kt
          grep -Fq "m.role IN ('owner','viewer')" supabase/proposals/two_phone_signed_staff_pull_REVIEW_ONLY.sql

  pg17-staff-signed-read:
    runs-on: ubuntu-latest
    needs: protect-owner-live
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Verify copied Staff JWT fails old RPC, signed nonce page is one-use, Owner continues
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_signed_read_pg17 \
            -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_signed_read_pg17 pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec marketpro_signed_read_pg17 psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/two_phone_signed_staff_read_pg17_local_only.sql
      - name: Stop ephemeral PG17
        if: always()
        run: docker stop marketpro_signed_read_pg17 || true

  pg17-atomic-bundle:
    runs-on: ubuntu-latest
    needs: protect-owner-live
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Verify 20-source atomic Team cutover on genuine V1 Owner schema
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_signed_bundle_pg17 \
            -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_signed_bundle_pg17 pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec marketpro_signed_bundle_pg17 psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/two_phone_atomic_cutover_pg17_staging_only.sql
      - name: Stop ephemeral PG17
        if: always()
        run: docker stop marketpro_signed_bundle_pg17 || true

  edge-and-bundle:
    runs-on: ubuntu-latest
    needs: protect-owner-live
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck signed Staff Edge and prove P-256 + cutover integrity
        run: |
          set -euo pipefail
          deno check supabase/functions/marketpro-staff-signed-read/index.ts
          node --test tests/v375_device_proof_crypto.test.mjs \
            tests/two_phone_staff_key_proof.test.mjs \
            tests/atomic_staff_finance_wire.test.mjs \
            tests/two_phone_atomic_bundle_integrity.test.mjs

  android-staff-read:
    runs-on: ubuntu-latest
    needs: protect-owner-live
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Sinhala typeface
        run: bash scripts/prepare_sinhala_font.sh
      - name: Compile Android and all read/finance/security JVM regressions
        run: gradle --no-daemon :app:testDebugUnitTest
