name: Market Pro v4.4.2 Verified Release
on:
  push:
    branches:
      - feature/marketpro-v442-subs-upload-recovery-qa
    paths:
      - '.github/workflows/marketpro-v442-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve QA and signed candidate from successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/Shanawebs/peliyagoda-market-v2/actions/artifacts/13002464166/zip > candidate.zip
          unzip -q candidate.zip -d candidate
      - name: Verify checksum, signature, version and package
        run: |
          set -euo pipefail
          APK=candidate/stagingMarket-release.apk
          test -s "$APK"
          EXPECTED=e1bd7fa7abc97d382595c987b8b8ecf81e68885a6a1741b47e027c94aec6485b
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$EXPECTED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionCode='442' versionName='4.4.2'"
          cp "$APK" MarketPro-v4.4.2-stable-signed.apk
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=marketpro-stable-signed-v4.4.2
          if gh release view "$TAG" -R Shanawebs/peliyagoda-market-v2 >/dev/null 2>&1; then
            gh release view "$TAG" -R Shanawebs/peliyagoda-market-v2 --json assets | jq -e 'any(.assets[]; .name == "MarketPro-v4.4.2-stable-signed.apk")'
          else
            gh release create "$TAG" MarketPro-v4.4.2-stable-signed.apk -R Shanawebs/peliyagoda-market-v2 --title "Market Pro v4.4.2 Subs Upload Recovery" --notes "Signed in-place update. Added per-photo upload diagnostics and immediate recovery retries. Existing local photos preserved." --prerelease
          fi
