name: Build Peliyagoda Market V2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-v2-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Expand staged source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f market-v2-source.tar.xz.b64 ]; then
            base64 --decode market-v2-source.tar.xz.b64 | tar --extract --xz --file=-
            test -f app/build.gradle.kts
            test -f settings.gradle.kts
            echo "Unpacked Kotlin Android project."
          else
            test -f app/build.gradle.kts
            echo "Working with tracked Kotlin Android project."
          fi

      - name: Commit unpacked source for future maintenance
        if: ${{ hashFiles('market-v2-source.tar.xz.b64') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f market-v2-source.tar.xz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Expand Android source into editable repository files"
            git push origin HEAD:main || echo "::warning::Could not push unpacked source; build continues."
          fi

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android API 35 is available
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile tests and debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PeliyagodaMarketV2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
