name: Build Peliyagoda Market V2 APK

on:
  push:
    branches: [main, feature/v228-stable-master-catalog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-v2-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify installed Android command line tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          echo "SDKMANAGER=$sdkmanager_path" >> "$GITHUB_ENV"
          "$sdkmanager_path" --version

      - name: Install Android API 35 without legacy SDK tools package
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile tests and debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PeliyagodaMarketV2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
