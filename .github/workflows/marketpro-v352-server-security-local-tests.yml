name: Market Pro V3.5.2 - Server Day Security SQL Tests

on:
  push:
    branches:
      - feature/marketpro-v352-server-team-write-gate-proposal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-db-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep working Cloud dashboard completely untouched
        run: |
          set -euo pipefail
          git diff --exit-code c30ec897e4135fb49dea616c965fb3889ace5510 HEAD -- web/marketpro-dashboard/
          grep -Fq 'purchasing_staff' supabase/proposals/v352_team_write_gate_REVIEW_ONLY.sql
          grep -Fq 'clock_timestamp() AT TIME ZONE' supabase/proposals/v352_team_write_gate_REVIEW_ONLY.sql
          grep -Fq 'Previous-day entries are Owner-only' supabase/proposals/v352_team_write_gate_REVIEW_ONLY.sql
          test -f supabase/tests/v352_team_write_gate_local_only.sql

      - name: Start throwaway PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_v352_pg \
            -e POSTGRES_PASSWORD=testonly \
            -v "$PWD":/work:ro \
            -w /work \
            postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_v352_pg pg_isready -U postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs marketpro_v352_pg
          exit 1

      - name: Test owner/staff rules against isolated database
        run: |
          set -euo pipefail
          docker exec marketpro_v352_pg psql -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/v352_team_write_gate_local_only.sql

      - name: Cleanup throwaway test container
        if: always()
        run: docker stop marketpro_v352_pg || true

  kotlin-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare validated Sinhala font
        run: bash scripts/prepare_sinhala_font.sh
      - name: Run local Kotlin policy/unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
