name: Market Pro Staging Owner Pending APK v0.5.0

on:
  push:
    branches:
      - feature/marketpro-staging-owner-pending-proposal-v050
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpro-staging-pending-owner-v050
  cancel-in-progress: true

jobs:
  production-frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep Production code and unrelated Edge source untouched
        shell: bash
        run: |
          set -euo pipefail
          BASE=c56e9caf60e4429439650f111a95b21b36725a39
          git diff --exit-code "$BASE" HEAD -- app/ web/marketpro-dashboard/ supabase/migrations/ supabase/proposals/ settings.gradle.kts
          other=$(git diff --name-only "$BASE" HEAD -- supabase/functions/ | grep -Ev '^supabase/functions/(marketpro-qa-owner-bootstrap/index.ts|_shared/pending_owner_edge_core.mjs|_shared/pending_owner_proof.mjs)$' || true)
          test -z "$other" || { echo "Unsafe unrelated Edge change"; exit 1; }
          other_sql=$(git diff --name-only "$BASE" HEAD -- supabase/staging/ | grep -v '^supabase/staging/staging_qa_owner_pending_service_only_v050.sql$' || true)
          test -z "$other_sql" || { echo "Unsafe staging DDL change"; exit 1; }
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.staging.pendingowner"' stagingOwner/build.gradle.kts
          grep -Fq 'versionName = "0.5.0"' stagingOwner/build.gradle.kts
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          sql=Path("supabase/staging/staging_qa_owner_pending_service_only_v050.sql").read_text()
          assert "status text NOT NULL DEFAULT 'pending' CHECK(status='pending')" in sql
          assert "enabled boolean NOT NULL DEFAULT false CHECK(enabled=false)" in sql
          assert "can_write boolean NOT NULL DEFAULT false CHECK(can_write=false)" in sql
          assert "TO service_role" in sql
          assert "TO authenticated;" not in sql and "TO anon;" not in sql
          a=Path("stagingOwner/src/main/java/lk/peliyagoda/marketpro/stagingowner/StagingOwnerAuth.kt").read_text()
          key=Path("stagingOwner/src/main/java/lk/peliyagoda/marketpro/stagingowner/OwnerKeystoreLab.kt").read_text()
          ui=Path("stagingOwner/src/main/java/lk/peliyagoda/marketpro/stagingowner/MainActivity.kt").read_text()
          transcript=Path("stagingOwner/src/main/java/lk/peliyagoda/marketpro/stagingowner/PendingOwnerTranscript.kt").read_text()
          assert "qqiheexpbuzohllugxrk.supabase.co" in a
          assert "lkoptqhodgjeuwwfihfr" not in a
          assert "sb_secret_" not in a
          assert '.put("explicit_consent",true)' in a
          assert '.put("intent","pending_issue")' in a
          assert '.put("intent","pending_verify")' in a
          assert 'registration_status")!="pending"' in a
          assert "signPendingOwnerChallenge" in key
          assert "PendingOwnerTranscript.VERSION" in key
          assert "marketpro-owner-pending-registration-v1" in transcript
          assert "AlertDialog.Builder(this)" in ui
          assert "PendingInstallId.getOrCreate(this)" in ui
          assert "registered_devices" not in a
          m=Path("stagingOwner/src/main/AndroidManifest.xml").read_text()
          assert 'android:allowBackup="false"' in m
          assert 'android:usesCleartextTraffic="false"' in m
          print("PASS: only Staging pending Owner code; no financial writer")
          PY

  postgres17-security:
    needs: production-frozen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Disposable Postgres17, no Supabase host connection
        run: |
          docker run --rm -d --name mp_pending_pg17 -e POSTGRES_PASSWORD=disposable-only -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 40); do
            if docker exec mp_pending_pg17 pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify pending-only, replay, wrong account/session, duplicate denial
        run: |
          docker exec mp_pending_pg17 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -f supabase/tests/staging_qa_owner_pending_pg17_v050.sql
      - name: Cleanup
        if: always()
        run: docker stop mp_pending_pg17 || true

  owner-p256-crypto:
    needs: production-frozen
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real EC P256 signatures, fresh MFA, nonce and earlier regressions
        run: |
          node --test tests/staging_owner_pending_edge_v050.test.mjs
          node --test tests/staging_owner_remote_proof_edge.test.mjs
          node --test tests/staging_owner_bootstrap_edge_integration.test.mjs
          node --test tests/staging_owner_bootstrap_key_crypto.test.mjs

  deno-edge:
    needs: production-frozen
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Pending Owner Edge route typecheck
        run: deno check supabase/functions/marketpro-qa-owner-bootstrap/index.ts

  android-pending-apk:
    needs: [production-frozen,postgres17-security,owner-p256-crypto,deno-edge]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Kotlin unit tests and isolated Staging APK build
        run: gradle --no-daemon --stacktrace :stagingOwner:testDebugUnitTest :stagingOwner:assembleDebug
      - name: Validate actual Android APK package and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=MarketPro-Staging-OwnerPending-v0.5.0-debug.apk
          cp stagingOwner/build/outputs/apk/debug/stagingOwner-debug.apk "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/mp_pending_badging.txt
          grep -Fq "package: name='lk.peliyagoda.marketpro.staging.pendingowner'" /tmp/mp_pending_badging.txt
          grep -Fq "versionName='0.5.0'" /tmp/mp_pending_badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/mp_pending_perms.txt
          grep -Fq 'android.permission.INTERNET' /tmp/mp_pending_perms.txt
          ! grep -Eq 'android.permission.(READ_SMS|CAMERA|READ_CONTACTS|READ_PHONE_STATE|WRITE_EXTERNAL_STORAGE)' /tmp/mp_pending_perms.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - name: Upload Staging test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-Staging-OwnerPending-v0.5.0-APK
          path: MarketPro-Staging-OwnerPending-v0.5.0-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Direct APK GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=marketpro-staging-owner-pending-v0.5.0
          APK=MarketPro-Staging-OwnerPending-v0.5.0-debug.apk
          NOTES='STAGING ONLY. Owner TOTP MFA and Android P256 server-signed proof to propose a device as PENDING. Separate appId; stable per-install UUID in private no-backup storage (not a hardware identifier). PENDING is never ACTIVE. No hardware attestation, no Staff, no Purchase Sync, no production app changes. DEBUG test APK. Device registration server gate may remain OFF until QA approval.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Market Pro Staging Owner PENDING v0.5.0 — QA ONLY" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets
