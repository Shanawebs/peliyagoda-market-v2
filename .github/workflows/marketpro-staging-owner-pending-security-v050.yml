name: Market Pro Staging Owner Pending Registration Security

on:
  push:
    branches:
      - feature/marketpro-staging-owner-pending-proposal-v050
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze Production and allow only pending Owner changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=c56e9caf60e4429439650f111a95b21b36725a39
          git diff --exit-code "$BASE" HEAD -- app/ stagingOwner/ web/marketpro-dashboard/ supabase/migrations/ supabase/proposals/
          other=$(git diff --name-only "$BASE" HEAD -- supabase/functions/ | grep -Ev '^supabase/functions/(marketpro-qa-owner-bootstrap/index.ts|_shared/pending_owner_edge_core.mjs|_shared/pending_owner_proof.mjs)$' || true)
          test -z "$other" || { echo "Disallowed Edge change"; exit 1; }
          extra=$(git diff --name-only "$BASE" HEAD -- supabase/staging/ | grep -v '^supabase/staging/staging_qa_owner_pending_service_only_v050.sql$' || true)
          test -z "$extra" || { echo "Disallowed staging DDL"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          sql=Path('supabase/staging/staging_qa_owner_pending_service_only_v050.sql').read_text()
          assert "status text NOT NULL DEFAULT 'pending' CHECK(status='pending')" in sql
          assert "enabled boolean NOT NULL DEFAULT false CHECK(enabled=false)" in sql
          assert "can_write boolean NOT NULL DEFAULT false CHECK(can_write=false)" in sql
          assert 'TO service_role' in sql
          assert 'TO authenticated;' not in sql and 'TO anon;' not in sql
          assert sql.rstrip().endswith('COMMIT;')
          PY

  postgres17-security:
    needs: production-frozen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL 17
        run: |
          docker run --rm -d --name mp_pending_pg17 -e POSTGRES_PASSWORD=disposable-only -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 40); do
            if docker exec mp_pending_pg17 pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check gate OFF, session, nonce replay and no activation
        run: |
          docker exec mp_pending_pg17 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -f supabase/tests/staging_qa_owner_pending_pg17_v050.sql
      - name: Cleanup
        if: always()
        run: docker stop mp_pending_pg17 || true

  owner-p256-crypto:
    needs: production-frozen
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real ECDSA verification, JWT, replay and regression suite
        run: |
          node --test tests/staging_owner_pending_edge_v050.test.mjs
          node --test tests/staging_owner_remote_proof_edge.test.mjs
          node --test tests/staging_owner_bootstrap_edge_integration.test.mjs
          node --test tests/staging_owner_bootstrap_key_crypto.test.mjs

  deno-edge:
    needs: production-frozen
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile exact Staging Edge entrypoint
        run: |
          grep -Fq 'withSupabase({auth:"user"}' supabase/functions/marketpro-qa-owner-bootstrap/index.ts
          deno check supabase/functions/marketpro-qa-owner-bootstrap/index.ts
