name: Market Pro Two Phone - Android Signed Finance Transport

on:
  push:
    branches:
      - feature/marketpro-two-phone-android-signed-finance-transport
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-production-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep Owner and all public Staff activation switches frozen
        run: |
          set -euo pipefail
          git diff --exit-code 2d18b81389ff0661355d33b8c54e775473b4b908 HEAD -- app/build.gradle.kts app/src/main/AndroidManifest.xml supabase/migrations/ web/marketpro-dashboard/
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_LOGIN_ENABLED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_PULL_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_FINANCE_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_DEVICE_PROOF_WRITE_ENFORCED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_OUTBOX_AUTO_UPLOAD", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'UnavailableStaffWriteTransport' app/src/main/java/lk/peliyagoda/marketpro/cloud/StaffFinancialOutboxCoordinator.kt
          grep -Fq 'StaffSignedFinanceHttpTransport(context)' app/src/main/java/lk/peliyagoda/marketpro/cloud/StaffFinancialOutboxCoordinator.kt
          test -f docs/TWO_PHONE_ANDROID_SIGNED_FINANCE_TRANSPORT_STATUS.md

  android-signing-compile-junit:
    runs-on: ubuntu-latest
    needs: owner-production-freeze
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Sinhala font
        run: bash scripts/prepare_sinhala_font.sh
      - name: Compile Android and test server challenge matching
        run: gradle --no-daemon :app:testDebugUnitTest

  sql-atomic-and-approved-key:
    runs-on: ubuntu-latest
    needs: owner-production-freeze
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test approved fingerprint and atomic Staff financial write in PG17
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_signed_android_pg \
            -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_signed_android_pg pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec marketpro_signed_android_pg psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/two_phone_atomic_proof_finance_pg17_local_only.sql
      - name: Cleanup
        if: always()
        run: docker stop marketpro_signed_android_pg || true

  edge-typed-and-p256:
    runs-on: ubuntu-latest
    needs: owner-production-freeze
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge TypeScript and WebCrypto protocol
        run: |
          set -euo pipefail
          deno check supabase/functions/marketpro-staff-finance/index.ts
          node --test tests/v375_device_proof_crypto.test.mjs tests/atomic_staff_finance_wire.test.mjs
