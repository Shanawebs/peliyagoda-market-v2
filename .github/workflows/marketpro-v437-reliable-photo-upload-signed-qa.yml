name: Market Pro v4.3.7 Safe Cross Phone Photo Upload Signed QA

on:
  push:
    branches:
      - feature/marketpro-v437-reliable-photo-upload-qa
    paths:
      - .github/workflows/marketpro-v437-reliable-photo-upload-signed-qa.yml
      - app/src/main/java/lk/peliyagoda/marketpro/ui/InvoicePhotoControl.kt
      - app/src/main/java/lk/peliyagoda/marketpro/photo/MarketPhotoSyncWorker.kt
      - app/src/main/java/lk/peliyagoda/marketpro/photo/MarketPhotoGatewayClient.kt
      - app/src/main/java/lk/peliyagoda/marketpro/data/MarketPhotoEntity.kt
      - app/src/main/java/lk/peliyagoda/marketpro/photo/MarketPhotoUploadPolicy.kt
      - app/src/test/java/lk/peliyagoda/marketpro/photo/MarketPhotoUploadPolicyTest.kt
      - supabase/functions/marketpro-photo-gateway-v430/index.ts
      - stagingMarket/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-qa-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MARKETPRO_REQUIRE_STABLE_SIGNING: 'true'
      MARKETPRO_STAGING_SIGNING_STORE_PATH: ${{ github.workspace }}/marketpro-staging-stable.jks
      MARKETPRO_STAGING_KEYSTORE_BASE64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
      MARKETPRO_STAGING_STORE_PASSWORD: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
      MARKETPRO_STAGING_KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
      MARKETPRO_STAGING_KEY_PASSWORD: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore permanent stable signing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MARKETPRO_STAGING_KEYSTORE_BASE64"
          test -n "$MARKETPRO_STAGING_STORE_PASSWORD"
          test -n "$MARKETPRO_STAGING_KEY_ALIAS"
          test -n "$MARKETPRO_STAGING_KEY_PASSWORD"
          printf '%s' "$MARKETPRO_STAGING_KEYSTORE_BASE64" | base64 --decode > "$MARKETPRO_STAGING_SIGNING_STORE_PATH"
          chmod 600 "$MARKETPRO_STAGING_SIGNING_STORE_PATH"
          test -s "$MARKETPRO_STAGING_SIGNING_STORE_PATH"
      - name: Build tests and signed restored date-gallery candidate without public release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :stagingMarket:assembleRelease
      - name: Verify v4.3.7 is a safe in-place update to signed v4.3.6
        shell: bash
        run: |
          set -euo pipefail
          APK=stagingMarket/build/outputs/apk/release/stagingMarket-release.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" > /tmp/marketpro-v437-badging
          grep -Fq "package: name='lk.peliyagoda.marketpro.staging.fullapp'" /tmp/marketpro-v437-badging
          grep -Fq "versionCode='437'" /tmp/marketpro-v437-badging
          grep -Fq 'lk.peliyagoda.marketpro.staging.fullapp' /tmp/marketpro-v437-badging
          grep -Fq "versionName='4.3.7'" /tmp/marketpro-v437-badging
          ! grep -Fq 'application-debuggable' /tmp/marketpro-v437-badging
          "$SIGNER" verify --print-certs "$APK" > /tmp/marketpro-v437-signers
          grep -Fqi '0a617edb7520deb0255cfc13ee0b2ee8382e2d8e6cb7f8e1dff68b4fbd130c4a' /tmp/marketpro-v437-signers
          sha256sum "$APK"
          cp "$APK" "MarketPro-v4.3.7-PhotoUpload-QA-signed.apk"
      - name: Keep verified signed APK as internal QA artifact only
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-v4.3.7-PhotoUpload-Signed-QA-NOT-RELEASE
          path: MarketPro-v4.3.7-PhotoUpload-QA-signed.apk
          retention-days: 3
          if-no-files-found: error
      - name: Remove local keystore
        if: always()
        shell: bash
        run: rm -f "$MARKETPRO_STAGING_SIGNING_STORE_PATH"
