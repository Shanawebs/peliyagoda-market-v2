name: Market Pro V3.5.6 - Strict UUID & Revision Safe Room Merge Tests

on:
  push:
    branches:
      - feature/marketpro-v356-safe-domain-merge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-db-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep working Cloud dashboard completely untouched
        run: |
          set -euo pipefail
          git diff --exit-code c30ec897e4135fb49dea616c965fb3889ace5510 HEAD -- web/marketpro-dashboard/
          grep -Fq 'purchasing_staff' supabase/proposals/v352_team_write_gate_REVIEW_ONLY.sql
          grep -Fq 'clock_timestamp() AT TIME ZONE' supabase/proposals/v352_team_write_gate_REVIEW_ONLY.sql
          grep -Fq 'Previous-day entries are Owner-only' supabase/proposals/v352_team_write_gate_REVIEW_ONLY.sql
          test -f supabase/tests/v352_team_write_gate_local_only.sql
          test -f supabase/proposals/v353_team_purchase_rpc_REVIEW_ONLY.sql
          test -f supabase/tests/v353_team_purchase_rpc_local_only.sql
          test -f supabase/proposals/v354_team_financial_rpc_REVIEW_ONLY.sql
          test -f supabase/tests/v354_team_financial_rpc_local_only.sql
          test -f supabase/proposals/v354_team_paged_pull_REVIEW_ONLY.sql
          test -f supabase/tests/v354_team_paged_pull_local_only.sql
          grep -Fq 'version = 7' app/src/main/java/lk/peliyagoda/marketpro/data/MarketDatabase.kt
          grep -Fq 'MIGRATION_6_7' app/src/main/java/lk/peliyagoda/marketpro/data/MarketDatabase.kt
          grep -Fq 'cloud_inbox_snapshots' app/src/main/java/lk/peliyagoda/marketpro/data/MarketDatabase.kt
          grep -Fq 'db.withTransaction' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudInboxStager.kt
          grep -Fq 'hasPendingLocalEditForCloudId' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudInboxStager.kt
          grep -Fq 'CloudInboxPagePolicyTest' app/src/test/java/lk/peliyagoda/marketpro/cloud/CloudInboxPagePolicyTest.kt
          grep -Fq 'name_key' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudInboxStager.kt
          grep -Fq 'CloudDomainMergeEngine' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudDomainMergeEngine.kt
          grep -Fq 'CONFLICT_LOCAL_PENDING' app/src/main/java/lk/peliyagoda/marketpro/cloud/DomainMergePolicy.kt
          grep -Fq 'DomainMergePolicyTest' app/src/test/java/lk/peliyagoda/marketpro/cloud/DomainMergePolicyTest.kt
          grep -Fq 'pull_applied_hash' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudDomainMergeEngine.kt
          grep -Fq 'db.withTransaction' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudDomainMergeEngine.kt
          grep -Fq 'server_today_colombo' supabase/proposals/v354_team_paged_pull_REVIEW_ONLY.sql
          grep -Fq 'p_expected_revision' supabase/proposals/v354_team_financial_rpc_REVIEW_ONLY.sql
          grep -Fq 'team_financial_audit' supabase/proposals/v354_team_financial_rpc_REVIEW_ONLY.sql
          grep -Fq 'p_expected_revision' supabase/proposals/v353_team_purchase_rpc_REVIEW_ONLY.sql
          grep -Fq 'team_purchase_audit' supabase/proposals/v353_team_purchase_rpc_REVIEW_ONLY.sql

      - name: Start throwaway PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_v356_pg \
            -e POSTGRES_PASSWORD=testonly \
            -v "$PWD":/work:ro \
            -w /work \
            postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_v356_pg pg_isready -U postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs marketpro_v356_pg
          exit 1

      - name: Test owner/staff purchase RPC against isolated database
        run: |
          set -euo pipefail
          docker exec marketpro_v356_pg psql -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/v354_team_financial_rpc_local_only.sql
          docker exec marketpro_v356_pg psql -v ON_ERROR_STOP=1 \
            -U postgres -d postgres -c "CREATE DATABASE marketpro_pull_test"
          docker exec marketpro_v356_pg psql -v ON_ERROR_STOP=1 \
            -U postgres -d marketpro_pull_test \
            -f supabase/tests/v354_team_paged_pull_local_only.sql

      - name: Cleanup throwaway test container
        if: always()
        run: docker stop marketpro_v356_pg || true

  kotlin-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare validated Sinhala font
        run: bash scripts/prepare_sinhala_font.sh
      - name: Run local Kotlin policy/unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
