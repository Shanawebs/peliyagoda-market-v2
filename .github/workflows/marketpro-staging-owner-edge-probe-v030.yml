name: Market Pro Staging — Owner AAL2 Edge Readonly Probe APK v0.3.0

on:
  push:
    branches:
      - feature/marketpro-staging-owner-edge-probe-v030
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpro-staging-owner-auth-v030
  cancel-in-progress: true

jobs:
  staging-auth-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve existing Market Pro app, Supabase server and dashboard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 7dce21ad683e4510f10da0023b2fbd2516f30303 HEAD -- app/ supabase/migrations/ supabase/staging/ supabase/proposals/ web/marketpro-dashboard/ scripts/
          unexpected=$(git diff --name-only 7dce21ad683e4510f10da0023b2fbd2516f30303 HEAD -- supabase/functions/ | grep -v '^supabase/functions/_shared/owner_bootstrap_edge_core.mjs$' || true)
          test -z "$unexpected" || { echo "Unexpected server function changes: $unexpected"; exit 1; }
          python3 -m unittest discover -s tests -p test_staging_owner_edge_probe_v030.py -v
          grep -Fq 'include(":app")' settings.gradle.kts
          grep -Fq 'include(":stagingOwner")' settings.gradle.kts
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify AAL2 read-only Edge, tampering, nonce and JWT source regressions
        run: |
          node --test tests/staging_owner_bootstrap_edge_integration.test.mjs
          node --test tests/staging_owner_bootstrap_key_crypto.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Owner Auth/MFA APK and run Kotlin unit tests
        run: gradle --no-daemon --stacktrace :stagingOwner:testDebugUnitTest :stagingOwner:assembleDebug
      - name: Verify app ID, installation permissions and APK integrity
        shell: bash
        run: |
          set -euo pipefail
          FILE=stagingOwner/build/outputs/apk/debug/stagingOwner-debug.apk
          APK=MarketPro-Staging-OwnerEdge-Probe-v0.3.0-debug.apk
          test -s "$FILE"
          cp "$FILE" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" >/tmp/staging-auth-badging.txt
          grep -Fq "package: name='lk.peliyagoda.marketpro.staging.edgeprobe'" /tmp/staging-auth-badging.txt
          grep -Fq "versionName='0.3.0'" /tmp/staging-auth-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/staging-auth-permissions.txt
          grep -Fq 'android.permission.INTERNET' /tmp/staging-auth-permissions.txt
          ! grep -Eq 'android.permission.(ACCESS_NETWORK_STATE|READ_SMS|READ_CONTACTS|CAMERA|WRITE_EXTERNAL_STORAGE)' /tmp/staging-auth-permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - name: Preserve generated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-Staging-OwnerEdge-Probe-v0.3.0-APK
          path: MarketPro-Staging-OwnerEdge-Probe-v0.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Direct APK download on GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=marketpro-staging-owner-edge-probe-v0.3.0
          APK=MarketPro-Staging-OwnerEdge-Probe-v0.3.0-debug.apk
          NOTES='Staging Owner Password and MFA + fresh Owner AAL2 read-only Edge status check. Real signed JWT sent to a pinned staging server only. No Owner enrollment, Staff access, purchase writes or data sync. Separate debug test app ID. Do not use Production passwords or install over working Market Pro. Physical Edge HTTP result unverified.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Market Pro Staging Owner + Secure Edge Check v0.3.0 — TEST ONLY" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets