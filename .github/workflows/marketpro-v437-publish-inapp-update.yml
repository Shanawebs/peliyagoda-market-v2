name: Publish Market Pro v4.3.7 Reliable Cross-Phone Photo Updates

on:
  push:
    branches:
      - feature/marketpro-v437-reliable-photo-upload-qa
    paths:
      - .github/workflows/marketpro-v437-publish-inapp-update.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: marketpro-v437-inapp-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.MARKETPRO_RELEASE_PAT || github.token }}
      SOURCE_RUN: '40930735941'
      SOURCE_SHA: 191d562d1f9ac597c4152f2c1f2b7c137b38ff59
      SOURCE_ARTIFACT: MarketPro-v4.3.7-PhotoUpload-Signed-QA-NOT-RELEASE
      SOURCE_APK: MarketPro-v4.3.7-PhotoUpload-QA-signed.apk
      APK: MarketPro-v4.3.7-signed.apk
      TAG: marketpro-photo-sync-v4.3.7
      OLD_TAG: marketpro-date-gallery-v4.3.6
      OLD_APK: MarketPro-v4.3.6-signed.apk
      EXPECTED_PACKAGE: lk.peliyagoda.marketpro.staging.fullapp
      EXPECTED_CERT: 0a617edb7520deb0255cfc13ee0b2ee8382e2d8e6cb7f8e1dff68b4fbd130c4a

    steps:
      - name: Wait for the pinned signed QA run and check it passed
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          ACTUAL_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.conclusion')"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          test "$CONCLUSION" = success

      - name: Obtain exact QA-verified signed APK (never rebuild it)
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir .
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK"

      - name: Install APK verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Verify v4.3.7 APK certificate, identity and in-place version upgrade
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" > /tmp/mp-new-badging
          grep -Fq "package: name='$EXPECTED_PACKAGE'" /tmp/mp-new-badging
          grep -Fq "versionCode='437'" /tmp/mp-new-badging
          grep -Fq "versionName='4.3.7'" /tmp/mp-new-badging
          ! grep -Fq 'application-debuggable' /tmp/mp-new-badging
          "$SIGNER" verify --print-certs "$APK" > /tmp/mp-new-cert
          grep -Fqi "$EXPECTED_CERT" /tmp/mp-new-cert
          mkdir -p /tmp/marketpro-previous
          gh release download "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$OLD_APK" --dir /tmp/marketpro-previous
          "$AAPT" dump badging "/tmp/marketpro-previous/$OLD_APK" > /tmp/mp-old-badging
          grep -Fq "package: name='$EXPECTED_PACKAGE'" /tmp/mp-old-badging
          grep -Fq "versionCode='436'" /tmp/mp-old-badging
          "$SIGNER" verify --print-certs "/tmp/marketpro-previous/$OLD_APK" > /tmp/mp-old-cert
          NEW_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/mp-new-cert | head -n1)"
          OLD_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/mp-old-cert | head -n1)"
          test -n "$NEW_CERT" && test "$NEW_CERT" = "$OLD_CERT"
          sha256sum "$APK"
          test "$(sha256sum "$APK" | cut -d ' ' -f1)" = "07670c24aec98b781a6e0d647dc69fa209757c24d026f9b38137d4b5caa06ca5"


      - name: Publish a new immutable-name v4.3.7 release for in-app updates
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing overwrite"
            exit 1
          fi
          cat > /tmp/marketpro-v437-release-notes.md <<'NOTES'
          # Market Pro v4.3.7 — Secure Cross-Phone Photo Sync QA

          Update in Market Pro → Menu → Check For Updates.
          Keep existing installation, local records, and stable device keys.

          - Automatically queues original JPEG files captured on Owner/Team phones.
          - One-time and periodic WorkManager uploads with network constraints.
          - Recovers previously captured, not-yet-uploaded originals in the last 7 days.
          - Signed, exact-name lookup resolves stable server Item IDs (no local ID reuse).
          - Bounded batch, deduplicated Photo ID, SHA-256 local file verification.
          - Failed uploads remain locally queued for durable retry; originals never deleted.
          - Approved Staff may upload timestamp-verified, immutable old-day photo
            evidence within 7 days; old-day Purchase/Qty/Price edits stay Owner-only.
          - Existing Box Cloud gallery displays all successfully uploaded photos
            across authorized Owner and Team phones. Refresh retrieves latest data.
          - Retains v4.3.6 gallery, photo icons, and Completed item sorting.
          - This is staging QA; Android unit tests and signing verified; observed
            uploads from physical devices are not yet independently confirmed.
          - Reproducible artifact provenance: exact approved GitHub Actions build
            #40930735941 from commit 191d562d1f9ac597c4152f2c1f2b7c137b38ff59.
            Signed APK SHA-256 07670c24aec98b781a6e0d647dc69fa209757c24d026f9b38137d4b5caa06ca5.
          - GitHub Release tag targets default branch to comply with workflow
            token permissions; source of binary is pinned above, not the tag.
          NOTES
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
            --target "main" --prerelease \
            --title 'Market Pro v4.3.7 — Reliable Photo Sync QA' \
            --notes-file /tmp/marketpro-v437-release-notes.md

      - name: Verify uploaded APK digest and length against signed QA original
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="sha256:$(sha256sum "$APK" | cut -d' ' -f1)"
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="MarketPro-v4.3.7-signed.apk") | .digest')"
          SIZE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="MarketPro-v4.3.7-signed.apk") | .size')"
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED"
          test "$SIZE" = "$(stat -c%s "$APK")"
          echo "Verified APK: $EXPECTED"
