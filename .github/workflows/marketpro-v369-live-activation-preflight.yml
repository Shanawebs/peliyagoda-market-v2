name: Market Pro V3.6.9 - Read-only Live Activation Preflight

on:
  push:
    branches:
      - feature/marketpro-v369-live-activation-preflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert dashboard unchanged and no production migration
        run: |
          set -euo pipefail
          git diff --exit-code c30ec897e4135fb49dea616c965fb3889ace5510 HEAD -- web/marketpro-dashboard/
          git diff --exit-code feature/marketpro-v368-replace-team-phone HEAD -- supabase/migrations/ || true
          test -f scripts/v369_live_activation_preflight_READ_ONLY.sql
          if grep -Eiq '^[[:space:]]*(CREATE|DROP|ALTER|INSERT|UPDATE|DELETE|TRUNCATE|GRANT|REVOKE|CALL|DO|COPY|MERGE|BEGIN)[[:space:];]' scripts/v369_live_activation_preflight_READ_ONLY.sql; then
            echo "ERROR: destructive or write-capable SQL keyword in the preflight" >&2
            exit 1
          fi
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_PHONE_TRANSFER_RPC_DEPLOYED", "false"' app/build.gradle.kts
      - name: Start disposable PostgreSQL 17
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_v369_pg \
            -e POSTGRES_PASSWORD=testonly \
            -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_v369_pg pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify existing replacement-security SQL on disposable database
        run: |
          set -euo pipefail
          docker exec marketpro_v369_pg psql -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/v368_team_phone_replacement_pg17_local_only.sql
      - name: Execute real preflight query on mock activated schema
        run: |
          set -euo pipefail
          RESULT="$(docker exec marketpro_v369_pg psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres -At -F '|' \
            -f scripts/v369_live_activation_preflight_READ_ONLY.sql)"
          echo "$RESULT"
          grep -Fq 'staff_role_schema_ready|PASS|' <<< "$RESULT"
          grep -Fq 'staff_direct_rest_isolated|PASS|' <<< "$RESULT"
          grep -Fq 'owner_phone_replacement_rpcs|PASS|' <<< "$RESULT"
          grep -Fq 'other_expenses_cloud_ready|BLOCKED|' <<< "$RESULT"
          grep -Fq 'legacy_writer_rpc_still_present|BLOCKED|' <<< "$RESULT"
      - name: Cleanup disposable test database
        if: always()
        run: docker stop marketpro_v369_pg || true
