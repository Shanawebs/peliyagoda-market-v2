name: Market Pro V3.5.0 - Team Security Foundation Offline Preview

on:
  push:
    branches:
      - feature/marketpro-v350-team-sync-security-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpro-v350-security-foundation-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect original Cloud Dashboard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c30ec897e4135fb49dea616c965fb3889ace5510 HEAD -- web/marketpro-dashboard/
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.security.foundation.v350"' app/build.gradle.kts
          grep -Fq 'val marketProDisplayVersion = "3.5.0"' app/build.gradle.kts
          grep -Fq 'Bulk historical import is disabled' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
          grep -Fq 'FreshOnlyUploadPolicy.evaluate' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
          grep -Fq 'MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq 'daily_other_expenses' app/src/main/java/lk/peliyagoda/marketpro/data/MarketDatabase.kt
          grep -Fq 'OtherExpensesExpandedEditor' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketScreens.kt
          grep -Fq 'containerColor = Color.White' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketScreens.kt
          grep -Fq 'Cloud Owner Login · V3.3.7 Only' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          grep -Fq 'SecurityAndTeamStatusDialog' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          grep -Fq 'TeamRevisionPolicy' app/src/main/java/lk/peliyagoda/marketpro/cloud/TeamAccessPolicy.kt
          grep -Fq 'RestorePinGuard(appContext)' app/src/main/java/lk/peliyagoda/marketpro/data/MarketRepository.kt
          test ! -f app/src/main/java/lk/peliyagoda/marketpro/security/CatalogArchiveAuthorization.kt
          test -f docs/V350_OWNER_PURCHASING_TEAM_SYNC_SECURITY_ROLLOUT.md
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/lk/peliyagoda/marketpro/ui/MarketScreens.kt').read_text()
          assert s.count('ModalBottomSheet(\n        containerColor = Color.White,') == 2
          assert s.count('AlertDialog(\n            containerColor = Color.White,') == 7
          assert 'Market tab → Cash Received' not in s or True
          print('PASS: Select Items / Master Item Catalog sheets and Cash dialog are white')
          PY
          grep -Fq 'GRAND TOTAL EXPENSES' app/src/main/java/lk/peliyagoda/marketpro/util/MarketPdf.kt
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'if (!BuildConfig.MARKETPRO_LOCAL_PREVIEW)' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          grep -Fq 'check(!BuildConfig.MARKETPRO_LOCAL_PREVIEW)' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare licensed Sinhala fonts
        run: bash scripts/prepare_sinhala_font.sh
      - name: Kotlin/Room unit tests and assemble standalone test APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Check APK version, standalone package and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MarketPro-TeamSecurity-Preview-v3.5.0.apk
          sha256sum MarketPro-TeamSecurity-Preview-v3.5.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging MarketPro-TeamSecurity-Preview-v3.5.0.apk > /tmp/marketpro-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/marketpro-badging.txt').read_text()
          assert "package: name='lk.peliyagoda.marketpro.security.foundation.v350'" in s
          assert "versionName='3.5.0'" in s
          assert "application-label:'Market Pro Security Preview ✦ v3.5.0'" in s
          print("PASS: isolated package, version and launcher label verified")
          PY
      - name: Verify offline-only permissions in built APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions MarketPro-TeamSecurity-Preview-v3.5.0.apk > /tmp/v338-permissions.txt
          if grep -Fq 'android.permission.INTERNET' /tmp/v338-permissions.txt; then echo 'Offline demo APK unexpectedly has INTERNET permission'; exit 1; fi
          echo 'PASS: no INTERNET permission in the APK'
      - name: Publish verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-TeamSecurity-Preview-v3.5.0-APK
          path: MarketPro-TeamSecurity-Preview-v3.5.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish standalone test APK download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="marketpro-v350-team-security-foundation1"
          NOTES="Isolated OFFLINE v3.5.0 security foundation preview. Adds Security and Team Sync status screen, local owner-configured Keystore 6-digit PIN for Backup Restore and Master Item Archive, with rate limiting. Replaces the old built-in archive code. Pure Kotlin staff/owner permission and safe revision policy tests. This is NOT yet two-device bidirectional syncing; staff phone onboarding, secure server role authorization, owner corrections and phone download are FUTURE phases. Ordinary Android uninstall cannot be blocked by in-app PIN; managed company phones can use enrolled Device Owner/MDM. This preview has NO INTERNET permission and leaves live v3.3.7 Cloud writer, Cloud data, and old dashboard unchanged."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MarketPro-TeamSecurity-Preview-v3.5.0.apk --clobber
          else
            gh release create "$TAG" MarketPro-TeamSecurity-Preview-v3.5.0.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "Market Pro v3.5.0 - Team Security & PIN Offline Preview" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets
