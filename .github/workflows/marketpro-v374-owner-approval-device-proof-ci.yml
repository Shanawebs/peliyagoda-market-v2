name: Market Pro V3.7.4 - Owner Approvals and Keystore Proof

on:
  push:
    branches:
      - feature/marketpro-v374-owner-approval-keystore-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert live migrations Owner application and dashboard preserved
        run: |
          set -euo pipefail
          git diff --exit-code de1c42f25b73dc6fe4b83ea79ab698b82ffc4f05 HEAD -- supabase/migrations/ web/marketpro-dashboard/ app/build.gradle.kts app/src/main/AndroidManifest.xml
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_LOGIN_ENABLED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_PULL_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_PAIRING_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_WRITE_APPROVAL_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_PHONE_TRANSFER_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'private key' docs/V374_STAFF_DEVICE_PROOF_AND_OWNER_APPROVAL.md
          grep -Fq 'review-only' docs/V374_STAFF_DEVICE_PROOF_AND_OWNER_APPROVAL.md

  android-unit-and-build:
    runs-on: ubuntu-latest
    needs: freeze-live
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare bundled Sinhala font
        run: bash scripts/prepare_sinhala_font.sh
      - name: Compile app and execute full JVM unit test suite
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Check security policy and signing key implementation
        run: |
          set -euo pipefail
          test -f app/src/test/java/lk/peliyagoda/marketpro/security/StaffDeviceProofPolicyTest.kt
          test -f app/src/test/java/lk/peliyagoda/marketpro/cloud/OwnerStaffWriterReviewPolicyTest.kt
          grep -Fq 'AndroidKeyStore' app/src/main/java/lk/peliyagoda/marketpro/security/StaffDeviceProofKeyStore.kt
          grep -Fq 'SHA256withECDSA' app/src/main/java/lk/peliyagoda/marketpro/security/StaffDeviceProofKeyStore.kt
          grep -Fq 'OwnerStaffWriterApprovalPanel(staffUserId, staffDeviceId)' app/src/main/java/lk/peliyagoda/marketpro/ui/TeamSessionPairingPanel.kt

  previous-supabase-security:
    runs-on: ubuntu-latest
    needs: freeze-live
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 Staff session and Owner workflow regression
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_v374_pg \
            -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_v374_pg pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec marketpro_v374_pg psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/v372_staff_auth_session_binding_pg17_local_only.sql
      - name: Clean local container
        if: always()
        run: docker stop marketpro_v374_pg || true
