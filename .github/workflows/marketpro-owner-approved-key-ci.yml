name: Market Pro Two Phone - Owner Approved Staff Public Key Security

on:
  push:
    branches: [feature/marketpro-owner-approved-device-key]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Existing Owner app production migrations and Dashboard untouched
        run: |
          set -euo pipefail
          git diff --exit-code 3e2645cc9e56b6f6d855736c26f09d939e08ba6a HEAD -- app/src/main/AndroidManifest.xml supabase/migrations/ web/marketpro-dashboard/
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_OUTBOX_AUTO_UPLOAD", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_KEY_ENROLLMENT_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_DEVICE_PROOF_WRITE_ENFORCED", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml

  p256-staff-possession:
    needs: freeze-production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test candidate Staff key ECDSA P256 proof before separate Owner approval
        run: node --test tests/two_phone_staff_key_enrollment_crypto.test.mjs

  postgres-owner-approved-key:
    needs: freeze-production
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Disposable PG17 Owner fingerprint match, nonce, session and old device revoke
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_staff_key_pg \
            -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_staff_key_pg pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec marketpro_staff_key_pg psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/two_phone_owner_approved_staff_key_pg17_local_only.sql
      - name: Stop ephemeral DB
        if: always()
        run: docker stop marketpro_staff_key_pg || true

  staff-key-edge-deno:
    needs: freeze-production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Typecheck authenticated signed candidate Edge API
        run: deno check supabase/functions/marketpro-staff-key-enrollment/index.ts

  android-junit:
    needs: freeze-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Prepare Sinhala font
        run: bash scripts/prepare_sinhala_font.sh
      - name: Run all Android owner and staff security unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
