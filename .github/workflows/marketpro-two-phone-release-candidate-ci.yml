name: Market Pro Two Phone Release Candidate - Finance And Safety

on:
  push:
    branches:
      - feature/marketpro-two-phone-release-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unchanged-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep deployed Owner/Dashboard and Android offline flags intact
        run: |
          set -euo pipefail
          git diff --exit-code e3e669b72b5f8949b4b6ca793e568f595f6e71cd HEAD -- app/build.gradle.kts app/src/main/AndroidManifest.xml web/marketpro-dashboard/ supabase/migrations/
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_LOGIN_ENABLED", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          test -f supabase/proposals/two_phone_other_expenses_REVIEW_ONLY.sql
          test -f docs/TWO_PHONE_RELEASE_CANDIDATE_PLAN.md

  other-expenses-db:
    runs-on: ubuntu-latest
    needs: unchanged-owner
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Run Owner-and-Staff expense API in isolated PostgreSQL 17
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_release_pg \
            -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_release_pg pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec marketpro_release_pg psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/two_phone_other_expenses_pg17_local_only.sql
      - name: Cleanup disposable DB
        if: always()
        run: docker stop marketpro_release_pg || true

  android-kotlin-unit:
    runs-on: ubuntu-latest
    needs: unchanged-owner
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare bundled Sinhala font
        run: bash scripts/prepare_sinhala_font.sh
      - name: Compile and test Android Cloud expenses policy
        run: gradle --no-daemon :app:testDebugUnitTest
