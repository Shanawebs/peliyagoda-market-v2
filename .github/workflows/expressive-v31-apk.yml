name: Market Pro Expressive v3.1 - Isolated APK

on:
  push:
    branches:
      - prototype/marketpro-expressive-v310
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expressive-v310-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Validate, unit test, and publish standalone v3.1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated v3.1 branch
        uses: actions/checkout@v4

      - name: Guard all older app identities and non-destructive removal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "prototype/marketpro-expressive-v310"
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.expressivepreview.v31"' app/build.gradle.kts
          grep -Fq 'versionName = "3.1.0-expressive-refinement-preview"' app/build.gradle.kts
          grep -Fq 'Market Pro ✦ v3.1' app/src/main/AndroidManifest.xml
          grep -Fq 'UPDATE items SET isActive = 0 WHERE id = :id AND isActive = 1' app/src/main/java/lk/peliyagoda/marketpro/data/MarketDatabase.kt
          grep -Fq 'items = catalogItems' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          grep -Fq 'selectedIconColor = Color.White' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          grep -Fq 'indicatorColor = ProColors.navy' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          echo "Confirmed: new package; source-based archive; dark tab indicator."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_path" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare verified Sinhala font assets
        run: bash scripts/prepare_sinhala_font.sh

      - name: Test and compile debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and name APK for direct download
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MarketPro-Expressive-v3.1.apk
          sha256sum MarketPro-Expressive-v3.1.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-Expressive-v3.1-APK
          path: MarketPro-Expressive-v3.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish separate preview release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="marketpro-expressive-v310-preview1"
          NOTES="Standalone Expressive v3.1 UI refinement: active nav capsule dark with white icon, master catalog PIN-protected archive, kitchen picker limited to active master items with duplicate create controls removed. Full original item and purchase IDs retained. Old 2.36 and v3.0 not modified. Independent package. Cloud login/sync disabled on preview. Debug-signed testing APK, not a production upgrade."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MarketPro-Expressive-v3.1.apk --clobber
          else
            gh release create "$TAG" MarketPro-Expressive-v3.1.apk \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Market Pro Expressive v3.1 - Isolated UI Preview" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets
