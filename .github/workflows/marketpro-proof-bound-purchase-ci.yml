name: Market Pro - Exact Signature Bound Purchase Security

on:
  push:
    branches:
      - feature/marketpro-proof-bound-purchase-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-production-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm Owner Android, cloud migration and Dashboard unchanged
        run: |
          set -euo pipefail
          git diff --exit-code ffbbc2e4ca00247b4300be6bbc2bdc7fcc54f793 HEAD -- app/build.gradle.kts app/src/main/AndroidManifest.xml supabase/migrations/ web/marketpro-dashboard/
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_DEVICE_PROOF_WRITE_ENFORCED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_OUTBOX_AUTO_UPLOAD", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          test -f supabase/proposals/two_phone_proof_bound_purchase_REVIEW_ONLY.sql

  exact-ecdsa-proof:
    runs-on: ubuntu-latest
    needs: no-production-touch
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ECDSA P-256 Android DER, one-request v2 transcript, downgrade rejection
        run: |
          node --test tests/v375_device_proof_crypto.test.mjs tests/two_phone_proof_bound_purchase_crypto.test.mjs

  atomic-purchase-pg17:
    runs-on: ubuntu-latest
    needs: no-production-touch
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Run revocation, replay, transaction and direct-RPC-bypass tests on throwaway PG17
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_proof_purchase_pg \
            -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_proof_purchase_pg pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec marketpro_proof_purchase_pg psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/two_phone_proof_bound_purchase_pg17_local_only.sql
      - name: Cleanup disposable DB
        if: always()
        run: docker stop marketpro_proof_purchase_pg || true

  signed-purchase-edge-deno-check:
    runs-on: ubuntu-latest
    needs: no-production-touch
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck authenticated Supabase Edge and exact-payload signature module
        run: deno check supabase/functions/marketpro-staff-signed-purchase/index.ts

  android-keystore-contract-unit:
    runs-on: ubuntu-latest
    needs: no-production-touch
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Sinhala font
        run: bash scripts/prepare_sinhala_font.sh
      - name: Compile Android signed-purchase Keystore adapter and full JVM tests
        run: gradle --no-daemon :app:testDebugUnitTest
