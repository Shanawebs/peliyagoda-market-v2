name: Market Pro V3.7.0 - Dual-channel Staff Writer Local Security Tests

on:
  push:
    branches:
      - feature/marketpro-v370-dual-channel-staff-writer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Strict live dashboard/migration/preview freeze
        run: |
          set -euo pipefail
          git diff --exit-code 42151b133e7543827911a424e37be6fd3c131557 HEAD -- web/marketpro-dashboard/ supabase/migrations/ app/
          grep -Fq 'MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          test -f supabase/proposals/v370_dual_channel_staff_writer_REVIEW_ONLY.sql
          test -f supabase/tests/v370_dual_channel_staff_writer_pg17_local_only.sql
          grep -Fq 'require_dual_channel_writer' supabase/proposals/v370_dual_channel_staff_writer_REVIEW_ONLY.sql
          if git diff --name-only 42151b133e7543827911a424e37be6fd3c131557 HEAD | grep -E '^supabase/migrations/|^web/marketpro-dashboard/|^app/'; then
            echo 'Production-facing code changed despite freeze' >&2
            exit 1
          fi
      - name: Start disposable PostgreSQL 17
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_v370_pg \
            -e POSTGRES_PASSWORD=testonly \
            -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_v370_pg pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify real purchase/requisition/cash/expense authorization
        run: |
          set -euo pipefail
          docker exec marketpro_v370_pg psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/v370_dual_channel_staff_writer_pg17_local_only.sql
      - name: Clean disposable database
        if: always()
        run: docker stop marketpro_v370_pg || true
