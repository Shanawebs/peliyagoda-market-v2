name: Market Pro STAGING — Isolated Owner Keystore APK v0.1.0

on:
  push:
    branches:
      - feature/marketpro-isolated-staging-owner-keystore-apk
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpro-owner-stage-localkey-v010
  cancel-in-progress: true

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no Production Android, API, or dashboard source changed
        shell: bash
        run: |
          set -euo pipefail
          BASE=9248667ca8d1b6d0b0473a790ef39449f3bc7190
          git diff --exit-code "$BASE" HEAD -- app/ supabase/ web/marketpro-dashboard/ scripts/gradle-env/
          grep -Fq 'include(":app")' settings.gradle.kts
          grep -Fq 'include(":stagingOwner")' settings.gradle.kts
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.staging.isolated"' stagingOwner/build.gradle.kts
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("stagingOwner")
          files=[p for p in root.rglob("*") if p.is_file()]
          assert len(files)>=6, "Missing staging-only sources"
          forbidden=["lkoptqhodgjeuwwfihfr","98c3b101-d452-4b6b-902c-0b1a31fc340c",
                     "af77cb66-76b2-492a-a460-06132f468713","sb_secret_","service_role"]
          for p in files:
              text=p.read_text(encoding="utf-8")
              assert all(x not in text for x in forbidden),f"Unsafe real identity/secret in {p}"
          manifest=(root/"src/main/AndroidManifest.xml").read_text()
          assert "<uses-permission" not in manifest
          assert 'android:allowBackup="false"' in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          assert "android.permission.INTERNET" not in manifest.replace(
              "<!-- Intentionally NO INTERNET and NO ACCESS_NETWORK_STATE permissions.\n"
              "         This standalone Staging Keystore lab CANNOT upload anything. -->","")
          print("PASS: entirely isolated, offline-only module")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          command -v java
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated staging app and run transcript unit tests
        run: gradle --no-daemon --stacktrace :stagingOwner:testDebugUnitTest :stagingOwner:assembleDebug
      - name: Print local unit-test failure details when needed
        if: failure()
        shell: bash
        run: |
          if test -d stagingOwner/build/test-results/testDebugUnitTest; then
            find stagingOwner/build/test-results/testDebugUnitTest -name '*.xml' -maxdepth 2 -exec cat {} \;
          fi
      - name: Verify actual APK package, network permissions and signing
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=stagingOwner/build/outputs/apk/debug/stagingOwner-debug.apk
          APK=MarketPro-Staging-OwnerKey-v0.1.0-debug.apk
          test -s "$SOURCE"
          cp "$SOURCE" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" >/tmp/stage_badging.txt
          grep -Fq "package: name='lk.peliyagoda.marketpro.staging.isolated'" /tmp/stage_badging.txt
          grep -Fq "versionName='0.1.0'" /tmp/stage_badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" >/tmp/stage_permissions.txt
          ! grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' /tmp/stage_permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
          echo "PASS: offline-only separate APK, signed with debug key"
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-Staging-OwnerKey-v0.1.0-APK
          path: MarketPro-Staging-OwnerKey-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish DIRECT APK test download as GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=marketpro-staging-owner-keystore-v0.1.0
          APK=MarketPro-Staging-OwnerKey-v0.1.0-debug.apk
          NOTES='OFFLINE ONLY — Owner Android Keystore P-256 local signing test. No Internet permission, no cloud login, no synced purchases, no Owner/Staff authorization, and no data migration. This is a completely separate Staging test app and does not replace the existing Market Pro purchasing app. Never use this build to enter purchasing or finance records.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Market Pro Staging Owner Key Test v0.1.0 — OFFLINE" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets
