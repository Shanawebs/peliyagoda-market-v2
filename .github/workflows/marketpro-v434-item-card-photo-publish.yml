name: Publish Market Pro v4.3.4 Item Card Cloud Photo QA Update

on:
  push:
    branches:
      - feature/marketpro-v434-item-card-photo-view-qa
    paths:
      - .github/workflows/marketpro-v434-item-card-photo-publish.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: marketpro-v434-photo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '40916377704'
      SOURCE_SHA: b03c44f158edce566c7bc8ee185d5bb89e6671a2
      SOURCE_ARTIFACT: MarketPro-v4.3.4-ItemCardPhotos-Signed-QA-NOT-RELEASE
      SOURCE_APK: MarketPro-v4.3.4-ItemCardPhotos-QA-signed.apk
      APK: MarketPro-v4.3.4-signed.apk
      TAG: marketpro-itemcard-photos-v4.3.4
      OLD_TAG: marketpro-stable-device-recovery-qa-v4.3.3
      OLD_APK: MarketPro-v4.3.3-SecureDeviceRecovery-QA-signed.apk
      EXPECTED_PACKAGE: lk.peliyagoda.marketpro.staging.fullapp
      EXPECTED_CERT: 0a617edb7520deb0255cfc13ee0b2ee8382e2d8e6cb7f8e1dff68b4fbd130c4a

    steps:
      - name: Wait for the pinned signed QA run and check it passed
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          ACTUAL_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.conclusion')"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          test "$CONCLUSION" = success

      - name: Obtain exact QA-verified signed APK (never rebuild it)
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir .
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK"

      - name: Install APK verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Verify v4.3.4 APK certificate, identity and in-place version upgrade
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" > /tmp/mp-new-badging
          grep -Fq "package: name='$EXPECTED_PACKAGE'" /tmp/mp-new-badging
          grep -Fq "versionCode='434'" /tmp/mp-new-badging
          grep -Fq "versionName='4.3.4'" /tmp/mp-new-badging
          ! grep -Fq 'application-debuggable' /tmp/mp-new-badging
          "$SIGNER" verify --print-certs "$APK" > /tmp/mp-new-cert
          grep -Fqi "$EXPECTED_CERT" /tmp/mp-new-cert
          mkdir -p /tmp/marketpro-previous
          gh release download "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$OLD_APK" --dir /tmp/marketpro-previous
          "$AAPT" dump badging "/tmp/marketpro-previous/$OLD_APK" > /tmp/mp-old-badging
          grep -Fq "package: name='$EXPECTED_PACKAGE'" /tmp/mp-old-badging
          grep -Fq "versionCode='433'" /tmp/mp-old-badging
          "$SIGNER" verify --print-certs "/tmp/marketpro-previous/$OLD_APK" > /tmp/mp-old-cert
          NEW_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/mp-new-cert | head -n1)"
          OLD_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/mp-old-cert | head -n1)"
          test -n "$NEW_CERT" && test "$NEW_CERT" = "$OLD_CERT"
          sha256sum "$APK"

      - name: Publish a new immutable-name v4.3.4 release for in-app updates
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing overwrite"
            exit 1
          fi
          cat > /tmp/marketpro-v434-release-notes.md <<'NOTES'
          # Market Pro v4.3.4 — Purchase Card Photos (QA)
          Update inside the installed Market Pro app: Menu → Check For Updates.
          **Do not uninstall or clear storage.** Preserves stable Android app ID,
          signed update certificate, local data and existing device credentials.

          - Removed separate Menu → View Cloud Photos entry.
          - Existing Market purchase item card Photo icon opens the same Item Photos popup.
          - Item popup shows this phone's originals plus signed Box Cloud photos matched
            to the selected business day and item.
          - Owner and approved Team phones can view Cloud photos without depending on
            matching local Room item numbers. Canonical server item IDs take priority;
            exact-name fallback refuses ambiguous multiple Cloud item IDs.
          - Cloud originals are verified with SHA-256 on download. Read-only viewing;
            no changes to purchases, catalog, Box credentials or device enrollment.
          - Samsung crash-recovery safeguards and photo-key recovery remain from v4.3.3.
          - Automatic background photo uploads remain PAUSED while device QA continues.
            Viewing previously uploaded photos does not establish upload success.

          GitHub CI Android tests, package ID, signing cert and increasing versionCode
          were checked before publication. Real Owner and Team phone regression
          testing is still required.
          NOTES
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --prerelease \
            --title 'Market Pro v4.3.4 — Purchase Card Photos QA' \
            --notes-file /tmp/marketpro-v434-release-notes.md

      - name: Verify uploaded APK digest and length against signed QA original
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="sha256:$(sha256sum "$APK" | cut -d' ' -f1)"
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="MarketPro-v4.3.4-signed.apk") | .digest')"
          SIZE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="MarketPro-v4.3.4-signed.apk") | .size')"
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED"
          test "$SIZE" = "$(stat -c%s "$APK")"
          echo "Verified APK: $EXPECTED"
