name: Market Pro V3.4.1 - White Popups Offline Preview

on:
  push:
    branches:
      - feature/marketpro-v341-white-popup-preview
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpro-v341-white-popup-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect original Cloud Dashboard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c30ec897e4135fb49dea616c965fb3889ace5510 HEAD -- web/marketpro-dashboard/
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.otherexpenses.whitepopup.v341"' app/build.gradle.kts
          grep -Fq 'val marketProDisplayVersion = "3.4.1"' app/build.gradle.kts
          grep -Fq 'Bulk historical import is disabled' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
          grep -Fq 'FreshOnlyUploadPolicy.evaluate' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
          grep -Fq 'MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq 'daily_other_expenses' app/src/main/java/lk/peliyagoda/marketpro/data/MarketDatabase.kt
          grep -Fq 'OtherExpensesExpandedEditor' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketScreens.kt
          grep -Fq 'containerColor = Color.White' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketScreens.kt
          grep -Fq 'Cloud Owner Login · V3.3.7 Only' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/lk/peliyagoda/marketpro/ui/MarketScreens.kt').read_text()
          assert s.count('ModalBottomSheet(\n        containerColor = Color.White,') == 2
          assert s.count('AlertDialog(\n            containerColor = Color.White,') == 7
          assert 'Market tab → Cash Received' not in s or True
          print('PASS: Select Items / Master Item Catalog sheets and Cash dialog are white')
          PY
          grep -Fq 'GRAND TOTAL EXPENSES' app/src/main/java/lk/peliyagoda/marketpro/util/MarketPdf.kt
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'if (!BuildConfig.MARKETPRO_LOCAL_PREVIEW)' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          grep -Fq 'check(!BuildConfig.MARKETPRO_LOCAL_PREVIEW)' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare licensed Sinhala fonts
        run: bash scripts/prepare_sinhala_font.sh
      - name: Kotlin/Room unit tests and assemble standalone test APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Check APK version, standalone package and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MarketPro-WhitePopups-Preview-v3.4.1.apk
          sha256sum MarketPro-WhitePopups-Preview-v3.4.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging MarketPro-WhitePopups-Preview-v3.4.1.apk > /tmp/marketpro-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/marketpro-badging.txt').read_text()
          assert "package: name='lk.peliyagoda.marketpro.otherexpenses.whitepopup.v341'" in s
          assert "versionName='3.4.1'" in s
          assert "application-label:'Market Pro Preview ✦ v3.4.1'" in s
          print("PASS: isolated package, version and launcher label verified")
          PY
      - name: Verify offline-only permissions in built APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions MarketPro-WhitePopups-Preview-v3.4.1.apk > /tmp/v338-permissions.txt
          if grep -Fq 'android.permission.INTERNET' /tmp/v338-permissions.txt; then echo 'Offline demo APK unexpectedly has INTERNET permission'; exit 1; fi
          echo 'PASS: no INTERNET permission in the APK'
      - name: Publish verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-WhitePopups-Preview-v3.4.1-APK
          path: MarketPro-WhitePopups-Preview-v3.4.1.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish standalone test APK download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="marketpro-v341-white-popup-preview1"
          NOTES="Market Pro v3.4.1 LOCAL ONLY test APK. Cash Received, Master Item Catalog and Select Items popup backgrounds updated to pure white #FFFFFF. Existing color accents, fonts, expenses auto-save and PDF features retained. Preview menu explains Cloud Owner Login works only in registered V3.3.7 app. This is a NEW isolated Android package and has NO INTERNET permission, cannot access Supabase, and will NOT alter original Dashboard UI, data, or single writer. Do not enter real business transactions into preview; old working V3.3.7 Cloud app must remain installed."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MarketPro-WhitePopups-Preview-v3.4.1.apk --clobber
          else
            gh release create "$TAG" MarketPro-WhitePopups-Preview-v3.4.1.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "Market Pro v3.4.1 - White Popups & Other Expenses Preview" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets
