name: Market Pro v4.2.7 Version-Only Animation Test QA

on:
  push:
    branches:
      - qa/marketpro-v427-progress-animation-test
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpro-animation-verification-qa-v427
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MARKETPRO_REQUIRE_STABLE_SIGNING: 'true'
      MARKETPRO_STAGING_SIGNING_STORE_PATH: ${{ github.workspace }}/marketpro-staging-stable.jks
      MARKETPRO_STAGING_KEYSTORE_BASE64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
      MARKETPRO_STAGING_STORE_PASSWORD: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
      MARKETPRO_STAGING_KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
      MARKETPRO_STAGING_KEY_PASSWORD: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production isolation and final staging gates
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.staging.fullapp"' stagingMarket/build.gradle.kts
          grep -Fq 'versionCode = 427' stagingMarket/build.gradle.kts
          grep -Fq 'versionName = marketProDisplayVersion' stagingMarket/build.gradle.kts
          grep -Fq 'create("stableStaging")' stagingMarket/build.gradle.kts
          grep -Fq 'MARKETPRO_REQUIRE_STABLE_SIGNING' stagingMarket/build.gradle.kts
          grep -Fq 'val marketProDisplayVersion = "4.2.7"' stagingMarket/build.gradle.kts
          grep -Fq '"MARKETPRO_STAGING_QA_FINANCE_RPC", "true"' stagingMarket/build.gradle.kts
          grep -Fq '"MARKETPRO_TWO_PHONE_AUTO_SYNC", "true"' stagingMarket/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_DOMAIN_MERGE_DEPLOYED", "true"' stagingMarket/build.gradle.kts
          grep -Fq '"MARKETPRO_STAGING_QA_FINANCE_RPC", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TWO_PHONE_AUTO_SYNC", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_DOMAIN_MERGE_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq 'marketpro_qa_finance_apply_v1' app/src/main/java/lk/peliyagoda/marketpro/cloud/StagingQaFinanceSync.kt
          grep -Fq 'StagingTwoPhoneSyncScheduler.enabled()' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncScheduler.kt
          grep -Fq 'Activate / Sync Two-Phone' app/src/main/java/lk/peliyagoda/marketpro/ui/CloudPhoneManagementPanel.kt
          ! grep -Rq 'service_role' app/src/main/java/lk/peliyagoda/marketpro/cloud/Staging*.kt
          ! grep -Rq 'sb_secret_' app/src/main/java/lk/peliyagoda/marketpro/cloud/Staging*.kt
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.INTERNET' stagingMarket/src/main/AndroidManifest.xml

      - name: Verify streamlined menu and preserved backup PIN flow
        shell: bash
        run: |
          set -euo pipefail
          UI=app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          ! grep -Fq '"Security & Backup"' "$UI"
          ! grep -Fq 'securityBackupOpen' "$UI"
          grep -Fq '"Backup All Records (JSON)"' "$UI"
          grep -Fq '"Restore Backup (JSON)"' "$UI"
          grep -Fq '"Security & Team Sync"' "$UI"
          grep -Fq 'restorePinOpen = true' "$UI"
          grep -Fq 'RestorePinDialog(' "$UI"
          grep -Fq 'restoreAuthorized = false' "$UI"
          grep -Fq 'vm.restoreBackup(json)' "$UI"
          grep -Fq 'check(cloudDao.state("enrolled") != "true")' app/src/main/java/lk/peliyagoda/marketpro/data/MarketRepository.kt

      - name: Verify Owner secure recovery requires Authenticator and explicit approval
        shell: bash
        run: |
          set -euo pipefail
          SQL=supabase/staging/marketpro_staging_owner_secure_relink_v413.sql
          C=app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudPhoneRegistryClient.kt
          P=app/src/main/java/lk/peliyagoda/marketpro/ui/CloudPhoneManagementPanel.kt
          T=app/src/main/java/lk/peliyagoda/marketpro/ui/TeamAccessSetupDialog.kt
          grep -Fq 'marketpro_qa_owner_secure_relink_v1' "$SQL"
          grep -Fq 'auth.jwt()' "$SQL"
          grep -Fq "v_jwt->>'aal' is distinct from 'aal2'" "$SQL"
          grep -Fq "a.value->>'method' = 'totp'" "$SQL"
          grep -Fq 'v_totp_epoch < v_now_epoch-300' "$SQL"
          grep -Fq "wm.role='owner'" "$SQL"
          grep -Fq "m.role='owner' and d.enabled" "$SQL"
          grep -Fq 'auth.sessions' "$SQL"
          grep -Fq 'p_confirm is distinct from true' "$SQL"
          grep -Fq 'qa_owner_relink_audit_v1' "$SQL"
          grep -Fq 'revoke all on function public.marketpro_qa_owner_secure_relink_v1' "$SQL"
          grep -Fq 'grant execute on function public.marketpro_qa_owner_secure_relink_v1' "$SQL"
          grep -Fq 'secureRelinkThisOwnerPhone()' "$C"
          grep -Fq 'Confirm Secure Re-Link' "$P"
          grep -Fq 'OwnerTotpMfaPanel()' "$T"
          grep -Fq 'p_confirm",true' "$C"

      - name: Verify one zero cash placeholder safety policy remains strict
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/lk/peliyagoda/marketpro/cloud/StagingCatalogBinder.kt
          TEST=app/src/test/java/lk/peliyagoda/marketpro/cloud/StagingZeroCashBootstrapPolicyTest.kt
          grep -Fq 'StagingZeroCashBootstrapPolicy.permits(dao.allCashReceived(),pending)' "$SRC"
          grep -Fq 'cashRows.size > 1' "$SRC"
          grep -Fq 'it.amountCents != 0L' "$SRC"
          grep -Fq 'operation.action == "upsert"' "$SRC"
          grep -Fq 'dao.allPurchases().isEmpty()' "$SRC"
          grep -Fq 'dao.allOtherExpenses().isEmpty()' "$SRC"
          grep -Fq 'cloud.clearPending()' "$SRC"
          grep -Fq 'nonzeroCashNeverAllowedEvenWithNoJournal' "$TEST"
          grep -Fq 'allRealFinancialJournalTypesAlwaysBlocked' "$TEST"

      - name: Dashboard syntax and staging migration checks
        shell: bash
        run: |
          set -euo pipefail
          node --check web/marketpro-dashboard/core.mjs
          node --check web/marketpro-dashboard/auth-client.mjs
          node --check web/marketpro-dashboard/app.mjs
          node --test web/tests/marketpro-dashboard.test.mjs
          grep -Fq 'https://qqiheexpbuzohllugxrk.supabase.co' web/marketpro-dashboard/config.mjs
          grep -Fq 'REFRESH_INTERVAL_MS = 5000' web/marketpro-dashboard/config.mjs
          grep -Fq 'connect-src https://qqiheexpbuzohllugxrk.supabase.co' web/marketpro-dashboard/vercel.json
          ! grep -Fq 'connect-src https://lkoptqhodgjeuwwfihfr.supabase.co' web/marketpro-dashboard/vercel.json
          grep -Fq 'other_expenses_cents' supabase/staging/marketpro_staging_dashboard_other_expenses_v410.sql
          grep -Fq 'security_invoker=true' supabase/staging/marketpro_staging_dashboard_other_expenses_v410.sql

      - name: Verify v4.2.7 daily finance sync regression fix
        shell: bash
        run: |
          set -euo pipefail
          POLICY=app/src/main/java/lk/peliyagoda/marketpro/cloud/DailySingletonIdentityPolicy.kt
          MERGE=app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudDomainMergeEngine.kt
          JOURNAL=app/src/main/java/lk/peliyagoda/marketpro/data/CloudSyncJournal.kt
          TEST=app/src/test/java/lk/peliyagoda/marketpro/cloud/DailySingletonIdentityPolicyTest.kt
          SQL=supabase/staging/marketpro_staging_daily_finance_sync_fix_v415.sql
          grep -Fq 'daily_cash_received' "$POLICY"
          grep -Fq 'daily_other_expenses' "$POLICY"
          grep -Fq 'rebindIdentity(' "$MERGE"
          grep -Fq 'CloudRecordKey.otherExpense(date)' "$MERGE"
          grep -Fq 'suspend fun rebindIdentity' "$JOURNAL"
          grep -Fq 'acknowledgedOrPreviouslyPulledUuidCanNeverBeRebound' "$TEST"
          grep -Fq "'daily_other_expenses'::text" "$SQL"
          grep -Fq 'sync_operations_entity_type_check' "$SQL"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Sinhala font
        run: bash scripts/prepare_sinhala_font.sh

      - name: Require and unpack PRIVATE stable staging signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MARKETPRO_STAGING_KEYSTORE_BASE64}" ||
                -z "${MARKETPRO_STAGING_STORE_PASSWORD}" ||
                -z "${MARKETPRO_STAGING_KEY_ALIAS}" ||
                -z "${MARKETPRO_STAGING_KEY_PASSWORD}" ]]; then
            echo '::error::Set all four MARKETPRO_STAGING_* GitHub Actions repository secrets before building the release.'
            exit 1
          fi
          umask 077
          printf '%s' "${MARKETPRO_STAGING_KEYSTORE_BASE64}" | base64 --decode > "${MARKETPRO_STAGING_SIGNING_STORE_PATH}"
          test -s "${MARKETPRO_STAGING_SIGNING_STORE_PATH}"
          keytool -list -keystore "${MARKETPRO_STAGING_SIGNING_STORE_PATH}" -storepass "${MARKETPRO_STAGING_STORE_PASSWORD}" -alias "${MARKETPRO_STAGING_KEY_ALIAS}" >/dev/null

      - name: Unit tests and both Android builds
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :stagingMarket:assembleRelease

      - name: Validate final staging APK
        shell: bash
        run: |
          set -euo pipefail
          APK=MarketPro-v4.2.7-AnimationTest-QA-signed.apk
          cp stagingMarket/build/outputs/apk/release/stagingMarket-release.apk "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/mp427_badging.txt
          if grep -Fq 'application-debuggable' /tmp/mp427_badging.txt; then
            echo '::error::Release APK is debuggable'
            exit 1
          fi
          grep -Fq "package: name='lk.peliyagoda.marketpro.staging.fullapp'" /tmp/mp427_badging.txt
          grep -Fq "versionCode='427'" /tmp/mp427_badging.txt
          grep -Fq "versionName='4.2.7'" /tmp/mp427_badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/mp427_permissions.txt
          grep -Fq 'android.permission.INTERNET' /tmp/mp427_permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > /tmp/mp427_signature.txt
          grep -Fqi '0a617edb7520deb0255cfc13ee0b2ee8382e2d8e6cb7f8e1dff68b4fbd130c4a' /tmp/mp427_signature.txt
          echo 'Verified permanent STAGING signing certificate fingerprint'
          sha256sum "$APK"

      - name: Assert this APK can update the published v4.2.6 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/marketpro-baseline
          gh release download marketpro-progress-qa-v4.2.6 \
            --repo Shanawebs/peliyagoda-market-v2 \
            --pattern 'MarketPro-v4.2.6-Progress-QA-signed.apk' \
            --dir /tmp/marketpro-baseline
          OLD=/tmp/marketpro-baseline/MarketPro-v4.2.6-Progress-QA-signed.apk
          NEW=MarketPro-v4.2.7-AnimationTest-QA-signed.apk
          test -s "$OLD"
          test -s "$NEW"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$OLD" > /tmp/marketpro_old_badging
          "$AAPT" dump badging "$NEW" > /tmp/marketpro_new_badging
          grep -Fq "package: name='lk.peliyagoda.marketpro.staging.fullapp'" /tmp/marketpro_old_badging
          grep -Fq "package: name='lk.peliyagoda.marketpro.staging.fullapp'" /tmp/marketpro_new_badging
          grep -Fq "versionCode='426'" /tmp/marketpro_old_badging
          grep -Fq "versionCode='427'" /tmp/marketpro_new_badging
          "$SIGNER" verify --print-certs "$OLD" > /tmp/marketpro_old_signer
          "$SIGNER" verify --print-certs "$NEW" > /tmp/marketpro_new_signer
          OLD_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/marketpro_old_signer | sed 's/.*: //')"
          NEW_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/marketpro_new_signer | sed 's/.*: //')"
          test -n "$OLD_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          echo 'v4.2.7 matches v4.2.6 app ID + signing certificate, with higher versionCode.'

      - uses: actions/upload-artifact@v4
        with:
          name: MarketPro-Staging-StableUpdate-v4.2.7-APK
          path: MarketPro-v4.2.7-AnimationTest-QA-signed.apk
          retention-days: 30
          if-no-files-found: error

      - name: Verify launcher title and retained Android version metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s MarketPro-v4.2.7-AnimationTest-QA-signed.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging MarketPro-v4.2.7-AnimationTest-QA-signed.apk > /tmp/marketpro-launcher.txt
          grep -Fq "application-label:'Market Pro'" /tmp/marketpro-launcher.txt
          grep -Fq "versionName='4.2.7'" /tmp/marketpro-launcher.txt
          grep -Fq "versionCode='427'" /tmp/marketpro-launcher.txt
          ! grep -Ei '^application-label:' /tmp/marketpro-launcher.txt | grep -Eq '(Staging|Stable|QA|v4[.]2)'
          grep -Fq 'resValue("string", "marketpro_launcher_name", "Market Pro")' stagingMarket/build.gradle.kts
          ! grep -Fq 'stringResource(R.string.marketpro_version_caption)' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          echo 'Launcher is Market Pro and version metadata is preserved.'

      - name: Verify automatic update security and Android install prompt
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"MARKETPRO_AUTO_UPDATE", "true"' stagingMarket/build.gradle.kts
          grep -Fq '"MARKETPRO_AUTO_UPDATE", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' stagingMarket/src/main/AndroidManifest.xml
          ! grep -Fq 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -Fq 'cache-path name="verified_apk_updates"' app/src/main/res/xml/invoice_file_paths.xml
          grep -Fq 'sha256(temp) == candidate.sha256' app/src/main/java/lk/peliyagoda/marketpro/update/MarketProAutoUpdater.kt
          grep -Fq 'signingFingerprint(context) == signingFingerprint(context, file.absolutePath)' app/src/main/java/lk/peliyagoda/marketpro/update/MarketProAutoUpdater.kt
          grep -Fq 'MarketProAutoUpdater.schedule(context.applicationContext)' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt

      - name: Verify Check For Updates is located between Security and Help
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path("app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt").read_text()
          positions = [src.index(x) for x in ['"Security & Team Sync"', 'else "Check For Updates"', '"Help & User Guide"']]
          assert positions == sorted(positions)
          assert src.count('else "Check For Updates"') == 1
          assert src.count("MarketProAutoUpdater.check(") == 2
          assert 'pendingVerifiedUpdate = result.ready' in src
          print("PASS: menu position and Check For Updates callback retained")
          PY

      - name: Verify v4.2.7 isolated requisition delete support
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"MARKETPRO_REQUISITION_DELETE_RPC", "true"' stagingMarket/build.gradle.kts
          grep -Fq '"MARKETPRO_REQUISITION_DELETE_RPC", "false"' app/build.gradle.kts
          grep -Fq 'marketpro_qa_requisition_delete_v421' app/src/main/java/lk/peliyagoda/marketpro/cloud/StagingQaFinanceSync.kt
          grep -Fq 'REMOVE_DELETED_REQUISITION' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudDomainMergeEngine.kt
          grep -Fq 'TO authenticated' supabase/staging/marketpro_requisition_delete_v421.sql
          grep -Fq 'revision=revision+1' supabase/staging/marketpro_requisition_delete_v421.sql
          test -s app/src/test/java/lk/peliyagoda/marketpro/cloud/RequisitionTombstonePolicyTest.kt

      - name: Verify bounded network recovery and Supabase metadata isolation
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/src/main/java/lk/peliyagoda/marketpro/update/MarketProAutoUpdater.kt
          SQL=supabase/staging/marketpro_public_update_channel_v424.sql
          grep -Fq 'private fun readCloudLatest()' "$FILE"
          grep -Fq 'networkRetry { readGithubLatest() }' "$FILE"
          grep -Fq 'networkRetry { readCloudLatest() }' "$FILE"
          grep -Fq 'private suspend fun downloadResumable' "$FILE"
          grep -Fq 'connection.setRequestProperty("Range",' "$FILE"
          grep -Fq 'FileOutputStream(file, canResume)' "$FILE"
          grep -Fq 'MARKETPRO_SUPABASE_PUBLISHABLE_KEY' "$FILE"
          ! grep -Fq 'service_role' "$FILE"
          grep -Fq 'signingFingerprint(context) == signingFingerprint(context, file.absolutePath)' "$FILE"
          grep -Fq 'sha256(temp) == candidate.sha256' "$FILE"
          grep -Fq 'ENABLE ROW LEVEL SECURITY' "$SQL"
          grep -Fq 'GRANT SELECT' "$SQL"
          ! grep -Eq '^GRANT (INSERT|UPDATE|DELETE)' "$SQL"
          grep -Fq 'marketpro-staging' "$SQL"

      - name: Verify real download progress, green tick animation and install gate
        shell: bash
        run: |
          set -euo pipefail
          UPD=app/src/main/java/lk/peliyagoda/marketpro/update/MarketProAutoUpdater.kt
          UI=app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          DIALOG=app/src/main/java/lk/peliyagoda/marketpro/ui/MarketUpdateProgressDialog.kt
          grep -Fq 'val downloadedBytes: Long' "$UPD"
          grep -Fq 'val totalBytes: Long' "$UPD"
          grep -Fq 'report(total)' "$UPD"
          grep -Fq 'withContext(Dispatchers.Main.immediate)' "$UPD"
          grep -Fq 'notifyProgress(onProgress, Progress.Verifying)' "$UPD"
          grep -Fq 'sha256(temp) == candidate.sha256' "$UPD"
          grep -Fq 'signingFingerprint(context) == signingFingerprint(context, file.absolutePath)' "$UPD"
          grep -Fq 'MarketUpdateProgressDialog(' "$UI"
          grep -Fq 'updateDialogStatus = UpdateStatus.Checking' "$UI"
          grep -Fq 'progress.downloadedBytes' "$UI"
          grep -Fq 'updateDialogStatus = UpdateStatus.Ready(result.ready.version)' "$UI"
          grep -Fq 'if (stage is UpdateStatus.Ready && ready != null)' "$UI"
          grep -Fq 'CircularProgressIndicator(' "$DIALOG"
          grep -Fq 'drawArc(' "$DIALOG"
          grep -Fq 'drawLine(' "$DIALOG"
          grep -Fq 'Download Completed' "$DIALOG"
          grep -Fq 'Install Update' "$DIALOG"
          python3 - <<'PY'
          from pathlib import Path
          src = Path("app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt").read_text()
          points = [src.index(t) for t in ['"Security & Team Sync"', 'else "Check For Updates"', '"Help & User Guide"']]
          assert points == sorted(points)
          assert src.count('MarketProAutoUpdater.check(') == 2
          print("PASS: UI menu order and both updater triggers preserved")
          PY

      - name: Enforce strict version-only QA diff from published v4.2.6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base = "0afa8863982753cd9d654145e0fae79033e41898"
          paths = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          expected = {
              "stagingMarket/build.gradle.kts",
              ".github/workflows/marketpro-v427-animation-test-qa.yml",
          }
          assert paths == expected, f"Unexpected source changes: {paths ^ expected}"
          old = subprocess.check_output(
              ["git", "show", f"{base}:stagingMarket/build.gradle.kts"], text=True)
          current = Path("stagingMarket/build.gradle.kts").read_text()
          expected_gradle = old.replace(
              'val marketProDisplayVersion = "4.2.6"',
              'val marketProDisplayVersion = "4.2.7"').replace(
              'versionCode = 426', 'versionCode = 427')
          assert current == expected_gradle, "Non-version Gradle modification found"
          print("PASS: exactly the two intended version fields changed")
          PY

      - name: Publish v4.2.7 signed QA release for in-app automatic updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="marketpro-animationtest-qa-v4.2.7"
          APK="MarketPro-v4.2.7-AnimationTest-QA-signed.apk"
          test -s "$APK"
          if gh release view "$TAG" --repo Shanawebs/peliyagoda-market-v2 >/dev/null 2>&1; then
            echo "::error::QA release exists already; never overwrite a published signed APK"
            exit 1
          fi
          gh release create "$TAG" "$APK" \
            --repo Shanawebs/peliyagoda-market-v2 \
            --target "$GITHUB_SHA" --prerelease \
            --title "Market Pro v4.2.7 Animation Test QA" \
            --notes "Market Pro v4.2.7 version-only QA test release. No functional, UI, database or Cloud code changes compared with v4.2.6. Use Market Pro v4.2.6 > Check For Updates to test live circular progress, downloaded MB, verification stage, animated green tick and Android Install Update prompt. Signed with the same staging certificate and same package ID; versionCode increases 426 -> 427. Never uninstall, clear app storage or restore backups just to apply this update."
          DIGEST="$(sha256sum "$APK" | awk '{print $1}')"
          gh api "repos/Shanawebs/peliyagoda-market-v2/releases/tags/$TAG" \
            --jq '.assets[] | select(.name == "MarketPro-v4.2.7-AnimationTest-QA-signed.apk") | .digest' \
            | grep -Fx "sha256:$DIGEST"
          echo "Published signed QA release with verified asset digest"
