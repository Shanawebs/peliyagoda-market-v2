name: Market Pro Staging — Owner Device Key Proof (source only)

on:
  push:
    branches:
      - feature/marketpro-staging-owner-keystore-bootstrap-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preserve Production Android, Supabase migrations and Dashboard
        run: |
          set -euo pipefail
          git diff --exit-code 0cb5ec175a2861b72c4b63cf3995a4d3994e26df HEAD -- app/ supabase/migrations/ supabase/functions/marketpro-staff-key-enrollment/ supabase/functions/marketpro-staff-device-proof/ web/marketpro-dashboard/
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_LOGIN_ENABLED", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml

  owner-crypto:
    needs: production-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Android P-256 signature and reject spoof/replay
        run: |
          python3 -m unittest discover -s tests -p test_staging_owner_bootstrap_contract.py -v
          node --test tests/staging_owner_bootstrap_key_crypto.test.mjs
          node --test tests/two_phone_staff_key_enrollment_crypto.test.mjs
          node --test tests/v375_device_proof_crypto.test.mjs
