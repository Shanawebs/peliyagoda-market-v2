name: Market Pro Staging — Owner Server-Time Signature APK v0.4.3

on:
  push:
    branches:
      - feature/marketpro-staging-owner-monotonic-proof-v043
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpro-owner-monotonic-v043
  cancel-in-progress: true

jobs:
  isolated-staging-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent production Android/SQL/dashboard changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=f294ffcca88a1f58609c1b426757615ae13c54dd
          git diff --exit-code "$BASE" HEAD -- app/ supabase/ web/marketpro-dashboard/ settings.gradle.kts
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.staging.remoteproofclock"' stagingOwner/build.gradle.kts
          grep -Fq 'versionName = "0.4.3"' stagingOwner/build.gradle.kts
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          python3 -m unittest discover -s tests -p test_staging_owner_monotonic_fix_v043.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual P256 DER and JWT/nonce negative cases
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/staging_owner_remote_proof_edge.test.mjs
          node --test tests/staging_owner_bootstrap_edge_integration.test.mjs
          node --test tests/staging_owner_bootstrap_key_crypto.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Kotlin clock-skew regression tests and assemble Staging only
        shell: bash
        run: gradle --no-daemon --stacktrace :stagingOwner:testDebugUnitTest :stagingOwner:assembleDebug
      - name: Check actual APK app ID, signing and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=MarketPro-Staging-OwnerClockFix-v0.4.3-debug.apk
          cp stagingOwner/build/outputs/apk/debug/stagingOwner-debug.apk "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/marketpro_v043_badging.txt
          grep -Fq "package: name='lk.peliyagoda.marketpro.staging.remoteproofclock'" /tmp/marketpro_v043_badging.txt
          grep -Fq "versionName='0.4.3'" /tmp/marketpro_v043_badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/marketpro_v043_permissions.txt
          grep -Fq 'android.permission.INTERNET' /tmp/marketpro_v043_permissions.txt
          ! grep -Eq 'android.permission.(CAMERA|READ_SMS|READ_CONTACTS|READ_PHONE_STATE|WRITE_EXTERNAL_STORAGE)' /tmp/marketpro_v043_permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - name: Upload debug-only Staging APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-Staging-OwnerClockFix-v0.4.3-APK
          path: MarketPro-Staging-OwnerClockFix-v0.4.3-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified direct APK pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=marketpro-staging-owner-clockfix-v0.4.3
          APK=MarketPro-Staging-OwnerClockFix-v0.4.3-debug.apk
          NOTES='STAGING TEST ONLY: Fix P5_PHONE_CLOCK_BEHIND by deriving Android signature time from DB challenge issued_at plus Android monotonic elapsedRealtime captured BEFORE the issue HTTP request. Server 60-second expiry and nonce single-use stay unchanged. Password + TOTP AAL2, no phone enrollment, Staff permission or financial data sync. Isolated debug-only app, Production unchanged.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Market Pro Staging v0.4.3 — Owner Signature Clock Fix" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets
