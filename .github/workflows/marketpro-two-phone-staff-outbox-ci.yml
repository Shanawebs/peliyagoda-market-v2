name: Market Pro Two-Phone - Staff Offline Auto Upload Preview

on:
  push:
    branches:
      - feature/marketpro-two-phone-staff-outbox-upload
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Owner app production and Cloud hard stop
        run: |
          set -euo pipefail
          git diff --exit-code 627bdd88ad4dcd1e8287d7027297986ed0bfc17d HEAD -- supabase/migrations/ web/marketpro-dashboard/ app/src/main/AndroidManifest.xml
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_LOGIN_ENABLED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_PULL_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_FINANCE_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_DEVICE_PROOF_WRITE_ENFORCED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_OUTBOX_AUTO_UPLOAD", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_DOMAIN_MERGE_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'UnavailableStaffWriteTransport' app/src/main/java/lk/peliyagoda/marketpro/cloud/StaffFinancialOutboxCoordinator.kt
          grep -Fq 'staff_outbox_verified_v1' app/src/main/java/lk/peliyagoda/marketpro/cloud/StaffFinancialOutboxCoordinator.kt

  android-junit:
    runs-on: ubuntu-latest
    needs: freeze-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Sinhala font
        run: bash scripts/prepare_sinhala_font.sh
      - name: Build Android and test Staff queue policy with all existing tests
        run: gradle --no-daemon :app:testDebugUnitTest

  regress-existing-db:
    runs-on: ubuntu-latest
    needs: freeze-production
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Run PostgreSQL 17 Staff financial/date/session regressions
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_staff_queue_pg \
            -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_staff_queue_pg pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec marketpro_staff_queue_pg psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/two_phone_other_expenses_pull_pg17_local_only.sql
      - name: Remove ephemeral DB
        if: always()
        run: docker stop marketpro_staff_queue_pg || true
