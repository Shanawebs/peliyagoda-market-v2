name: Market Pro Staging — Owner Bootstrap Edge Auth/Crypto (review only)

on:
  push:
    branches:
      - feature/marketpro-staging-owner-bootstrap-edge-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Working production app and staging-only SQL untouched
        run: |
          set -euo pipefail
          git diff --exit-code 69359690acc4eaf66a3cdf5d489e347530fcf4aa HEAD -- app/ supabase/migrations/ supabase/staging/ supabase/proposals/ web/marketpro-dashboard/ supabase/functions/marketpro-staff-device-proof/ supabase/functions/marketpro-staff-key-enrollment/
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_LOGIN_ENABLED", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml

  owner-edge-crypto:
    needs: production-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Owner HTTP intent security + P-256 + Staff regressions
        run: |
          set -euo pipefail
          node --test tests/staging_owner_bootstrap_edge_integration.test.mjs
          node --test tests/staging_owner_bootstrap_key_crypto.test.mjs
          node --test tests/two_phone_staff_key_enrollment_crypto.test.mjs
          node --test tests/v375_device_proof_crypto.test.mjs
      - name: No Edge deploy, secrets or unauthorized grants
        run: |
          set -euo pipefail
          test -f supabase/functions/marketpro-qa-owner-bootstrap/index.ts
          grep -Fq 'withSupabase({auth:"user"}' supabase/functions/marketpro-qa-owner-bootstrap/index.ts
          grep -Fq 'npm:@supabase/server@1.9.2' supabase/functions/marketpro-qa-owner-bootstrap/index.ts
          if git diff --name-only 69359690acc4eaf66a3cdf5d489e347530fcf4aa HEAD | grep -E '(supabase/config.toml|app/build.gradle.kts|supabase/migrations/|\.env)'; then
            echo "Unexpected deploy/config/prod change"; exit 1
          fi

  deno-types:
    needs: production-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Owner Edge entrypoint and auth wrapper
        run: deno check supabase/functions/marketpro-qa-owner-bootstrap/index.ts
