name: Market Pro Cloud Cutover Local Readiness (test only)

on:
  push:
    branches:
      - prototype/marketpro-cloud-cutover-readiness-v335
      - prototype/marketpro-v3-fresh-record-safety-v336
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-v335-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect existing live Cloud Dashboard source and UI
        shell: bash
        run: |
          set -euo pipefail
          # The existing dashboard URL, login, visuals and backend routing stay intact.
          # Reject ANY accidental change to its web source compared to v3.3.4.
          git diff --exit-code c30ec897e4135fb49dea616c965fb3889ace5510 HEAD -- web/marketpro-dashboard/
          test -f docs/V3_EXISTING_DASHBOARD_UI_FREEZE.md
          test -f app/src/main/java/lk/peliyagoda/marketpro/cloud/FreshOnlyUploadPolicy.kt
          ! grep -Eiq 'delete from|truncate |drop table|drop schema' app/src/main/java/lk/peliyagoda/marketpro/cloud/FreshOnlyUploadPolicy.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          TOOL="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$TOOL"
          yes | "$TOOL" --licenses >/dev/null 2>&1 || true
          "$TOOL" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify local-only code never activates another writer
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'val cloudUploadLocked: Boolean get() = true' app/src/main/java/lk/peliyagoda/marketpro/cloud/LocalCutoverReadiness.kt
          grep -Fq 'val serverHandoverRequired: Boolean get() = true' app/src/main/java/lk/peliyagoda/marketpro/cloud/LocalCutoverReadiness.kt
          ! grep -Eq 'CloudSyncScheduler|CloudRestClient|HttpURLConnection|enableAfterOwnerConfirmation|marketpro_apply_change' app/src/main/java/lk/peliyagoda/marketpro/cloud/LocalCutoverReadiness.kt
          grep -Fq 'Cloud upload: LOCKED — safe preview mode.' app/src/main/java/lk/peliyagoda/marketpro/ui/CloudPreflightDialog.kt
      - name: Prepare verified Sinhala font assets
        run: bash scripts/prepare_sinhala_font.sh
      - name: Compile Android sources and run JVM unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: No APK and no server deployment
        run: |
          echo "SOURCE-ONLY gate passed. No APK is published or signed."
          echo "Original V2.31 Cloud writer and V3.34 Room/KeyStore data remain untouched."
