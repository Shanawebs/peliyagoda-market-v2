name: Market Pro v4.2.9 Box Connect QA

on:
  push:
    branches:
      - feature/marketpro-v429-box-connect-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketpro-v429-box-connect-qa
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MARKETPRO_REQUIRE_STABLE_SIGNING: 'true'
      MARKETPRO_STAGING_SIGNING_STORE_PATH: ${{ github.workspace }}/marketpro-staging-stable.jks
      MARKETPRO_STAGING_KEYSTORE_BASE64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
      MARKETPRO_STAGING_STORE_PASSWORD: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
      MARKETPRO_STAGING_KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
      MARKETPRO_STAGING_KEY_PASSWORD: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify QA-only scope and compatible Android update
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.staging.fullapp"' stagingMarket/build.gradle.kts
          grep -Fq 'val marketProDisplayVersion = "4.2.9"' stagingMarket/build.gradle.kts
          grep -Fq 'versionCode = 429' stagingMarket/build.gradle.kts
          grep -Fq 'MARKETPRO_REQUIRE_STABLE_SIGNING' stagingMarket/build.gradle.kts
          grep -Fq 'create("stableStaging")' stagingMarket/build.gradle.kts
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_AUTO_UPDATE", "true"' stagingMarket/build.gradle.kts
          grep -Fq '"MARKETPRO_TWO_PHONE_AUTO_SYNC", "true"' stagingMarket/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.INTERNET' stagingMarket/src/main/AndroidManifest.xml
          grep -Fq 'BoxCloudConnectDialog(' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          grep -Fq '"Box Photo Cloud (Owner)"' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          grep -Fq 'OwnerTotpMfaPanel()' app/src/main/java/lk/peliyagoda/marketpro/ui/BoxCloudConnectDialog.kt
          grep -Fq 'marketpro-box-oauth-start' app/src/main/java/lk/peliyagoda/marketpro/cloud/BoxOAuthConnectionClient.kt
          ! grep -RE 'BOX_CLIENT_SECRET|BOX_REFRESH_TOKEN|sb_secret_' \
            app/src/main/java/lk/peliyagoda/marketpro/ui/BoxCloudConnectDialog.kt \
            app/src/main/java/lk/peliyagoda/marketpro/cloud/BoxOAuthConnectionClient.kt \
            app/src/main/java/lk/peliyagoda/marketpro/cloud/BoxOAuthAuthorizationUrlPolicy.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt").read_text()
          assert p.count('BoxCloudConnectDialog(')==1
          assert p.count('boxConnectOpen = true')==1
          assert p.count('"Box Photo Cloud (Owner)"')==1
          assert p.index('"Security & Team Sync"') < p.index('"Help & User Guide"')
          print("Owner Box UI is isolated and appears exactly once")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Sinhala font
        run: bash scripts/prepare_sinhala_font.sh
      - name: Require same permanent staging signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MARKETPRO_STAGING_KEYSTORE_BASE64"
          test -n "$MARKETPRO_STAGING_STORE_PASSWORD"
          test -n "$MARKETPRO_STAGING_KEY_ALIAS"
          test -n "$MARKETPRO_STAGING_KEY_PASSWORD"
          umask 077
          printf '%s' "$MARKETPRO_STAGING_KEYSTORE_BASE64" | base64 --decode > "$MARKETPRO_STAGING_SIGNING_STORE_PATH"
          test -s "$MARKETPRO_STAGING_SIGNING_STORE_PATH"
          keytool -list -keystore "$MARKETPRO_STAGING_SIGNING_STORE_PATH" \
            -storepass "$MARKETPRO_STAGING_STORE_PASSWORD" \
            -alias "$MARKETPRO_STAGING_KEY_ALIAS" >/dev/null
      - name: Full JVM tests and Android debug plus signed staging APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest \
            :app:assembleDebug :stagingMarket:assembleRelease
      - name: Verify final APK identity, signature and non-debug status
        shell: bash
        run: |
          set -euo pipefail
          APK=MarketPro-v4.2.9-BoxConnect-QA-signed.apk
          cp stagingMarket/build/outputs/apk/release/stagingMarket-release.apk "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" >/tmp/mp429-badging.txt
          grep -Fq "package: name='lk.peliyagoda.marketpro.staging.fullapp'" /tmp/mp429-badging.txt
          grep -Fq "versionCode='429'" /tmp/mp429-badging.txt
          grep -Fq "versionName='4.2.9'" /tmp/mp429-badging.txt
          grep -Fq "application-label:'Market Pro'" /tmp/mp429-badging.txt
          ! grep -Fq 'application-debuggable' /tmp/mp429-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" >/tmp/mp429-cert.txt
          grep -Fqi '0a617edb7520deb0255cfc13ee0b2ee8382e2d8e6cb7f8e1dff68b4fbd130c4a' /tmp/mp429-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Fq android.permission.INTERNET
          sha256sum "$APK"
      - name: Upload QA APK artifact, do not publish release
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-v4.2.9-BoxConnect-QA
          path: MarketPro-v4.2.9-BoxConnect-QA-signed.apk
          retention-days: 30
          if-no-files-found: error
