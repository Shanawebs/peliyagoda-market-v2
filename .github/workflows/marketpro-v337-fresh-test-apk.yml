name: Market Pro V3.3.7 - Fresh-Only Cloud Test APK

on:
  push:
    branches:
      - prototype/marketpro-v3-cloud-attach-v337
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpro-v337-fresh-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect original Cloud Dashboard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c30ec897e4135fb49dea616c965fb3889ace5510 HEAD -- web/marketpro-dashboard/
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.freshtest.v337"' app/build.gradle.kts
          grep -Fq 'val marketProDisplayVersion = "3.3.7"' app/build.gradle.kts
          grep -Fq 'Bulk historical import is disabled' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
          grep -Fq 'FreshOnlyUploadPolicy.evaluate' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
          grep -Fq 'FreshExistingWorkspaceAttach' app/src/main/java/lk/peliyagoda/marketpro/ui/FreshCloudSyncDialog.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare licensed Sinhala fonts
        run: bash scripts/prepare_sinhala_font.sh
      - name: Kotlin/Room unit tests and assemble standalone test APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Check APK version, standalone package and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MarketPro-Fresh-v3.3.7-Test.apk
          sha256sum MarketPro-Fresh-v3.3.7-Test.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging MarketPro-Fresh-v3.3.7-Test.apk > /tmp/marketpro-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/marketpro-badging.txt').read_text()
          assert "package: name='lk.peliyagoda.marketpro.freshtest.v337'" in s
          assert "versionName='3.3.7'" in s
          assert "application-label:'Market Pro ✦ v3.3.7'" in s
          print("PASS: isolated package, version and launcher label verified")
          PY
      - name: Publish verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-Fresh-v3.3.7-Test-APK
          path: MarketPro-Fresh-v3.3.7-Test.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish standalone test APK download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="marketpro-v337-fresh-cloud-test1"
          NOTES="Standalone Market Pro v3.3.7 FRESH-ONLY test APK. WARNING: CLOUD UPLOAD REMAINS LOCKED until owner signs in AND original V2 writer is retired AND this unique device is authorized server-side. Clean new local financial database only: do NOT restore any V2/V3.34 JSON backup. The current 330 Cloud demo records, original Cloud Dashboard UI/URL/login and all older Android apps are unchanged. Initial catalog UUIDs are matched read-only; only post-enrollment NEW financial records may sync. Before enrolling a device, verify test-phone data state and backups. This APK uses an isolated package and CI debug signing; it is NOT an upgrade or production release. Do not use for important financial records."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MarketPro-Fresh-v3.3.7-Test.apk --clobber
          else
            gh release create "$TAG" MarketPro-Fresh-v3.3.7-Test.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "Market Pro v3.3.7 - Fresh Cloud Sync Test (standalone)" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets
