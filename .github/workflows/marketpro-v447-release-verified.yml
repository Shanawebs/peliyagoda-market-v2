name: Market Pro v4.4.7 Published Signed Release
on:
  push:
    branches:
      - feature/marketpro-v447-session-stable-release-qa
    paths:
      - '.github/workflows/marketpro-v447-release-verified.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all original QA jobs passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Shanawebs/peliyagoda-market-v2/actions/runs/41195790903/jobs > jobs.json
          jq -e '([.jobs[] | select(.name == "android-qa" and .conclusion == "success")] | length) == 1' jobs.json
          jq -e '([.jobs[] | select(.name == "signed-candidate" and .conclusion == "success")] | length) == 1' jobs.json
      - name: Retrieve approved, signed QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Shanawebs/peliyagoda-market-v2/actions/artifacts/13040452767/zip > artifact.zip
          unzip -q artifact.zip -d candidate
      - name: Verify signed APK and version 447
        run: |
          set -euo pipefail
          APK="$(find candidate -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='lk.peliyagoda.marketpro.staging.fullapp' versionCode='447' versionName='4.4.7'"
          cp "$APK" MarketPro-v4.4.7-stable-signed.apk
          echo "CANDIDATE_SHA256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          echo "CANDIDATE_BYTES=$(stat -c %s "$APK")"
      - name: Publish immutable versioned asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=marketpro-stable-signed-v4.4.7
          if gh release view "$TAG" -R Shanawebs/peliyagoda-market-v2 >/dev/null 2>&1; then
            echo "Existing release detected; refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" MarketPro-v4.4.7-stable-signed.apk -R Shanawebs/peliyagoda-market-v2 --target "$GITHUB_SHA" --title "Market Pro v4.4.7 Owner and Subs Session Stability" --notes "QA-verified signed in-place update. Persistent encrypted session refresh with rotated refresh-token persistence, shared refresh mutexes, periodic best-effort keepalive, local-only manual logout and precise session-expired errors. Phone approvals, photos and purchases unchanged." --prerelease
      - name: Verify public asset exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download marketpro-stable-signed-v4.4.7 -R Shanawebs/peliyagoda-market-v2 --pattern 'MarketPro-v4.4.7-stable-signed.apk' --dir verify
          cmp MarketPro-v4.4.7-stable-signed.apk verify/MarketPro-v4.4.7-stable-signed.apk
          echo "RELEASE_SHA256=$(sha256sum verify/MarketPro-v4.4.7-stable-signed.apk | cut -d ' ' -f 1)"
          echo "RELEASE_BYTES=$(stat -c %s verify/MarketPro-v4.4.7-stable-signed.apk)"
