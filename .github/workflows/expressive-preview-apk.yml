name: Market Pro Expressive Preview - Independent APK

on:
  push:
    branches:
      - prototype/marketpro-expressive-v300
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expressive-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expressive-preview:
    name: Unit tests, compile, and publish separate preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4

      - name: Reject production package identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "prototype/marketpro-expressive-v300"
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.expressivepreview"' app/build.gradle.kts
          grep -Fq 'versionName = "3.0.0-expressive-preview"' app/build.gradle.kts
          grep -Fq 'Market Pro ✦ Preview' app/src/main/AndroidManifest.xml
          grep -Fq 'MarketExpressiveTheme {' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          echo "Production package and 2.36 branch are not used."

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify SDK manager and install Android 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_path" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare verified Sinhala font assets
        run: bash scripts/prepare_sinhala_font.sh

      - name: Run tests and compile isolated APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK and rename for direct download
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MarketPro-Expressive-Preview.apk
          sha256sum MarketPro-Expressive-Preview.apk

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-Expressive-Preview-APK
          path: MarketPro-Expressive-Preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish PRE-RELEASE direct APK link
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="marketpro-expressive-v300-preview1"
          NOTES="Independent UI prototype. Side-by-side Android package; Market Pro 2.36 unchanged. Cloud login and sync disabled in preview to protect existing data. Do not uninstall 2.36. Debug-signed test APK, not production upgrade."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MarketPro-Expressive-Preview.apk --clobber
          else
            gh release create "$TAG" MarketPro-Expressive-Preview.apk \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Market Pro Expressive v3.0 - UI PREVIEW" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets
