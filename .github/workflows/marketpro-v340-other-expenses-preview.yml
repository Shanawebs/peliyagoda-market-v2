name: Market Pro V3.4.0 - Other Expenses Local UI / PDF Preview

on:
  push:
    branches:
      - feature/marketpro-v340-other-expenses-ui-pdf
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpro-v340-expenses-preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect original Cloud Dashboard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c30ec897e4135fb49dea616c965fb3889ace5510 HEAD -- web/marketpro-dashboard/
          grep -Fq 'applicationId = "lk.peliyagoda.marketpro.otherexpenses.preview.v340"' app/build.gradle.kts
          grep -Fq 'val marketProDisplayVersion = "3.4.0"' app/build.gradle.kts
          grep -Fq 'Bulk historical import is disabled' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
          grep -Fq 'FreshOnlyUploadPolicy.evaluate' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
          grep -Fq 'MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq 'daily_other_expenses' app/src/main/java/lk/peliyagoda/marketpro/data/MarketDatabase.kt
          grep -Fq 'OtherExpensesExpandedEditor' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketScreens.kt
          grep -Fq 'GRAND TOTAL EXPENSES' app/src/main/java/lk/peliyagoda/marketpro/util/MarketPdf.kt
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'if (!BuildConfig.MARKETPRO_LOCAL_PREVIEW)' app/src/main/java/lk/peliyagoda/marketpro/ui/MarketProApp.kt
          grep -Fq 'check(!BuildConfig.MARKETPRO_LOCAL_PREVIEW)' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudSyncEngine.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare licensed Sinhala fonts
        run: bash scripts/prepare_sinhala_font.sh
      - name: Kotlin/Room unit tests and assemble standalone test APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Check APK version, standalone package and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MarketPro-OtherExpenses-Preview-v3.4.0.apk
          sha256sum MarketPro-OtherExpenses-Preview-v3.4.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging MarketPro-OtherExpenses-Preview-v3.4.0.apk > /tmp/marketpro-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/marketpro-badging.txt').read_text()
          assert "package: name='lk.peliyagoda.marketpro.otherexpenses.preview.v340'" in s
          assert "versionName='3.4.0'" in s
          assert "application-label:'Market Pro Preview ✦ v3.4.0'" in s
          print("PASS: isolated package, version and launcher label verified")
          PY
      - name: Verify offline-only permissions in built APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions MarketPro-OtherExpenses-Preview-v3.4.0.apk > /tmp/v338-permissions.txt
          if grep -Fq 'android.permission.INTERNET' /tmp/v338-permissions.txt; then echo 'Offline demo APK unexpectedly has INTERNET permission'; exit 1; fi
          echo 'PASS: no INTERNET permission in the APK'
      - name: Publish verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPro-OtherExpenses-Preview-v3.4.0-APK
          path: MarketPro-OtherExpenses-Preview-v3.4.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish standalone test APK download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="marketpro-v340-other-expenses-preview1"
          NOTES="Separate LOCAL-ONLY Market Pro v3.4.0 Other Expenses preview. Market tab Cash Received popup now has split Purchase Expenses and expandable Other Expenses: Transport, Labor Charge, Meals and Drinks, Others, and Special Remarks auto-save by date. Dashboard PDF includes category expenses, detailed Other Expenses, grand total and balance. This separate APK has NO INTERNET permission, never accesses Supabase, and does not replace working v3.3.7 Cloud writer. Old web Dashboard UI and records are unchanged. Do not use for real business transactions; syncing new expenses to Cloud requires additional backend and signing upgrade work."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MarketPro-OtherExpenses-Preview-v3.4.0.apk --clobber
          else
            gh release create "$TAG" MarketPro-OtherExpenses-Preview-v3.4.0.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "Market Pro v3.4.0 - Other Expenses UI / PDF Preview" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets
