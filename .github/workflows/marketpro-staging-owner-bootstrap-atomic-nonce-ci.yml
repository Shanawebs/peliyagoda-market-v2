name: Market Pro Staging — Owner Bootstrap One-Use Nonce (PG17)

on:
  push:
    branches:
      - feature/marketpro-staging-owner-bootstrap-atomic-nonce
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Existing app, dashboard and deployed server untouched
        run: |
          set -euo pipefail
          git diff --exit-code 86f7e0899c4bb563361f05fa341f13f7f6efc39e HEAD -- app/ supabase/migrations/ supabase/functions/ web/marketpro-dashboard/
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_LOGIN_ENABLED", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml

  pg17-onetime-transaction:
    runs-on: ubuntu-latest
    needs: production-freeze
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL 17
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_owner_bootstrap_nonce_pg             -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_owner_bootstrap_nonce_pg pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test Owner AAL2/session, nonce rotation, atomic replay denial, private ACL
        run: |
          set -euo pipefail
          docker exec marketpro_owner_bootstrap_nonce_pg psql -X -v ON_ERROR_STOP=1             -U postgres -d postgres             -f supabase/tests/staging_qa_owner_bootstrap_atomic_nonce_pg17_local_only.sql
      - name: Stop temporary Postgres
        if: always()
        run: docker stop marketpro_owner_bootstrap_nonce_pg || true

  owner-ecdsa:
    runs-on: ubuntu-latest
    needs: production-freeze
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual EC P-256 signatures and altered context fail
        run: |
          node --test tests/staging_owner_bootstrap_key_crypto.test.mjs
          node --test tests/two_phone_staff_key_enrollment_crypto.test.mjs
