name: Market Pro v4.4.0 R2 Cleanup QA

on:
  push:
    branches:
      - feature/marketpro-v440-r2-only-cleanup-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build staging debug and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :stagingMarket:assembleDebug :app:testDebugUnitTest
      - name: No APK publication
        run: echo "QA only. No release changes."

  signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Confirm stable signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
      - name: Restore stable signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/marketpro-stable.jks"
      - name: Build signed release candidate
        env:
          MARKETPRO_STAGING_SIGNING_STORE_PATH: ${{ runner.temp }}/marketpro-stable.jks
          MARKETPRO_STAGING_STORE_PASSWORD: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
          MARKETPRO_STAGING_KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
          MARKETPRO_STAGING_KEY_PASSWORD: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
          MARKETPRO_REQUIRE_STABLE_SIGNING: 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :stagingMarket:assembleRelease
      - name: Validate signed v4.4.0 APK
        run: |
          set -euo pipefail
          APK="$(find stagingMarket/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='lk.peliyagoda.marketpro.staging.fullapp' versionCode='440' versionName='4.4.0'"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: marketpro-v440-r2-cleanup-signed-candidate
          path: |
            stagingMarket/build/outputs/apk/release/*.apk
            stagingMarket/build/outputs/apk/release/*.sha256
          retention-days: 14
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/marketpro-stable.jks"

# Release publication is intentionally disabled until QA verification.

  publish-v440:
    needs: [verify, signed-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marketpro-v440-r2-cleanup-signed-candidate
          path: candidate
      - name: Verify signed v4.4.0 candidate
        run: |
          set -euo pipefail
          APK="$(find candidate -name '*.apk' -type f | head -n 1)"
          test -f "$APK"
          actual="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          expected="$(cut -d ' ' -f 1 "$APK.sha256")"
          test "$actual" = "$expected"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='lk.peliyagoda.marketpro.staging.fullapp' versionCode='440' versionName='4.4.0'"
          cp "$APK" MarketPro-v4.4.0-stable-signed.apk
      - name: Publish new version without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="marketpro-stable-signed-v4.4.0"
          if gh release view "$TAG" --repo Shanawebs/peliyagoda-market-v2 >/dev/null 2>&1; then
            echo "v4.4.0 release already exists; no overwrite."
            exit 0
          fi
          gh release create "$TAG" MarketPro-v4.4.0-stable-signed.apk \
            --repo Shanawebs/peliyagoda-market-v2 \
            --title "Market Pro v4.4.0 R2 Cleanup" \
            --notes "In-place update from v4.3.9. Cloudflare R2 gallery labels, completed migration button removed. Box backup retained." \
            --prerelease
