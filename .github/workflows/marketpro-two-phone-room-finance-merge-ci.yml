name: Market Pro Two Phone - Safe Room Other Expenses Merge

on:
  push:
    branches:
      - feature/marketpro-two-phone-room-finance-merge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-live-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze live app, release flags, and production database migrations
        run: |
          set -euo pipefail
          git diff --exit-code 43f2a681c32b1ca2e6a52059bc329e2e009e61ea HEAD -- app/src/main/AndroidManifest.xml supabase/migrations/ web/marketpro-dashboard/
          grep -Fq '"MARKETPRO_LOCAL_PREVIEW", "true"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_LOGIN_ENABLED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_PULL_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_TEAM_DOMAIN_MERGE_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq '"MARKETPRO_STAFF_WRITE_APPROVAL_RPC_DEPLOYED", "false"' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET" tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -Fq 'daily_other_expenses' app/src/main/java/lk/peliyagoda/marketpro/cloud/CloudDomainMergeEngine.kt
          grep -Fq 'CONFLICT_LOCAL_PENDING' app/src/main/java/lk/peliyagoda/marketpro/cloud/DomainMergePolicy.kt

  android-compile-and-unit:
    runs-on: ubuntu-latest
    needs: guard-live-owner
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare installed Sinhala fallback
        run: bash scripts/prepare_sinhala_font.sh
      - name: Compile Kotlin and run financial merge unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

  postgres-expense-pull:
    runs-on: ubuntu-latest
    needs: guard-live-owner
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Validate paged expense pulls in disposable PG17 database
        run: |
          set -euo pipefail
          docker run -d --rm --name marketpro_expense_pull \
            -e POSTGRES_PASSWORD=testonly -v "$PWD":/work:ro -w /work postgres:17
          for i in $(seq 1 50); do
            if docker exec marketpro_expense_pull pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec marketpro_expense_pull psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -f supabase/tests/two_phone_other_expenses_pull_pg17_local_only.sql
      - name: Clean temporary PostgreSQL
        if: always()
        run: docker stop marketpro_expense_pull || true
