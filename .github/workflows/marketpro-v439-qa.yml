name: Market Pro v4.3.9 QA Only

on:
  pull_request:
    paths:
      - 'app/**'
      - 'stagingMarket/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/marketpro-v439-qa.yml'
  push:
    branches:
      - feature/marketpro-v439-r2-photo-reliability-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate runner Android SDK
        run: test -d "$ANDROID_HOME" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -d "$ANDROID_HOME/platforms"
      - name: Check Gradle wrapper
        run: test -f ./gradlew && chmod +x ./gradlew
      - name: Compile Market Pro staging and run regression tests
        run: ./gradlew --no-daemon :stagingMarket:assembleDebug :app:testDebugUnitTest
      - name: QA only - never publish or sign
        run: echo "QA completed; no release uploaded"

  signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Confirm stable signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
      - name: Restore original signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/marketpro-stable.jks"
      - name: Build release APK with original key
        env:
          MARKETPRO_STAGING_SIGNING_STORE_PATH: ${{ runner.temp }}/marketpro-stable.jks
          MARKETPRO_STAGING_STORE_PASSWORD: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
          MARKETPRO_STAGING_KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
          MARKETPRO_STAGING_KEY_PASSWORD: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
          MARKETPRO_REQUIRE_STABLE_SIGNING: 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :stagingMarket:assembleRelease
      - name: Verify release APK signature and version
        run: |
          APK="$(find stagingMarket/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='lk.peliyagoda.marketpro.staging.fullapp' versionCode='439' versionName='4.3.9'"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: marketpro-v439-signed-candidate
          path: |
            stagingMarket/build/outputs/apk/release/*.apk
            stagingMarket/build/outputs/apk/release/*.sha256
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/marketpro-stable.jks"

  publish-update:
    needs: [android-qa, signed-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve signed candidate from verified build
        uses: actions/download-artifact@v4
        with:
          name: marketpro-v439-signed-candidate
          path: candidate
      - name: Verify pinned signed APK digest
        run: |
          set -euo pipefail
          APK="$(find candidate -name '*.apk' -type f | head -n 1)"
          test -f "$APK"
          actual="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          expected="$(cut -d " " -f 1 "$APK.sha256")"
          test "$actual" = "$expected"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" MarketPro-v4.3.9-stable-signed.apk
      - name: Publish v4.3.9 for Check For Updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view marketpro-stable-signed-v4.3.9 -R Shanawebs/peliyagoda-market-v2 >/dev/null 2>&1; then
            gh release view marketpro-stable-signed-v4.3.9 -R Shanawebs/peliyagoda-market-v2 --json isDraft,assets > release.json
            test "$(jq -r '.isDraft' release.json)" = "false"
            if jq -e '.assets[] | select(.name == "MarketPro-v4.3.9-stable-signed.apk")' release.json >/dev/null; then
              echo "Verified non-draft v4.3.9 release already contains updater APK."
              exit 0
            fi
            gh release upload marketpro-stable-signed-v4.3.9 MarketPro-v4.3.9-stable-signed.apk -R Shanawebs/peliyagoda-market-v2
            echo "Added missing signed APK to existing non-draft release."
            exit 0
          fi
          gh release create marketpro-stable-signed-v4.3.9 \
            MarketPro-v4.3.9-stable-signed.apk \
            --repo Shanawebs/peliyagoda-market-v2 \
            --title "Market Pro v4.3.9 Stable Signed Update" \
            --notes "Signed in-place update over v4.3.8. Unified photo permissions, R2 sync retry, Owner-only Box-to-R2 migration. Do not disconnect Box until migration verification." \
            --prerelease

  release-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect published release asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Shanawebs/peliyagoda-market-v2/releases/tags/marketpro-stable-signed-v4.3.9 \
            --jq '.assets[] | select(.name == "MarketPro-v4.3.9-stable-signed.apk") | {name: .name, size: .size, digest: .digest, url: .browser_download_url, state: .state}'
