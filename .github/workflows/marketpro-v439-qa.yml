name: Market Pro v4.4.2 QA and Signed Candidate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'stagingMarket/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/marketpro-v442-qa.yml'
  push:
    branches:
      - feature/marketpro-v442-subs-upload-recovery-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate runner Android SDK
        run: test -d "$ANDROID_HOME" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -d "$ANDROID_HOME/platforms"
      - name: Check Gradle wrapper
        run: test -f ./gradlew && chmod +x ./gradlew
      - name: Compile Market Pro staging and run regression tests
        run: ./gradlew --no-daemon :stagingMarket:assembleDebug :app:testDebugUnitTest
      - name: QA only - never publish or sign
        run: echo "QA completed; no release uploaded"

  signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Confirm stable signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
      - name: Restore original signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/marketpro-stable.jks"
      - name: Build release APK with original key
        env:
          MARKETPRO_STAGING_SIGNING_STORE_PATH: ${{ runner.temp }}/marketpro-stable.jks
          MARKETPRO_STAGING_STORE_PASSWORD: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
          MARKETPRO_STAGING_KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
          MARKETPRO_STAGING_KEY_PASSWORD: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
          MARKETPRO_REQUIRE_STABLE_SIGNING: 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :stagingMarket:assembleRelease
      - name: Verify release APK signature and version
        run: |
          APK="$(find stagingMarket/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='lk.peliyagoda.marketpro.staging.fullapp' versionCode='442' versionName='4.4.2'"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: marketpro-v442-signed-candidate
          path: |
            stagingMarket/build/outputs/apk/release/*.apk
            stagingMarket/build/outputs/apk/release/*.sha256
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/marketpro-stable.jks"



  publish-verified-v442:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve already QA-passed signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/Shanawebs/peliyagoda-market-v2/actions/artifacts/13002464166/zip > candidate.zip
          unzip -q candidate.zip -d candidate
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          APK=candidate/stagingMarket-release.apk
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "e1bd7fa7abc97d382595c987b8b8ecf81e68885a6a1741b47e027c94aec6485b"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionCode='442' versionName='4.4.2'"
          cp "$APK" MarketPro-v4.4.2-stable-signed.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=marketpro-stable-signed-v4.4.2
          if gh release view "$TAG" -R Shanawebs/peliyagoda-market-v2 >/dev/null 2>&1; then
            gh release view "$TAG" -R Shanawebs/peliyagoda-market-v2 --json assets | jq -e 'any(.assets[]; .name == "MarketPro-v4.4.2-stable-signed.apk")'
          else
            gh release create "$TAG" MarketPro-v4.4.2-stable-signed.apk -R Shanawebs/peliyagoda-market-v2 --title "Market Pro v4.4.2 Subs Photo Upload Recovery" --notes "In-place signed upgrade; pending photo recovery diagnostics." --prerelease
          fi
