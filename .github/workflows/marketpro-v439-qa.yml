name: Market Pro v4.4.8 QA and Signed Candidate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'stagingMarket/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/marketpro-v448-qa.yml'
  push:
    branches:
      - feature/marketpro-v448-five-subs-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate runner Android SDK
        run: test -d "$ANDROID_HOME" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -d "$ANDROID_HOME/platforms"
      - name: Check Gradle wrapper
        run: test -f ./gradlew && chmod +x ./gradlew
      - name: Compile Market Pro staging and run regression tests
        run: ./gradlew --no-daemon :stagingMarket:assembleDebug :app:testDebugUnitTest
      - name: QA only - never publish or sign
        run: echo "QA completed; no release uploaded"

  signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Confirm stable signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
      - name: Restore original signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MARKETPRO_STAGING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/marketpro-stable.jks"
      - name: Build release APK with original key
        env:
          MARKETPRO_STAGING_SIGNING_STORE_PATH: ${{ runner.temp }}/marketpro-stable.jks
          MARKETPRO_STAGING_STORE_PASSWORD: ${{ secrets.MARKETPRO_STAGING_STORE_PASSWORD }}
          MARKETPRO_STAGING_KEY_ALIAS: ${{ secrets.MARKETPRO_STAGING_KEY_ALIAS }}
          MARKETPRO_STAGING_KEY_PASSWORD: ${{ secrets.MARKETPRO_STAGING_KEY_PASSWORD }}
          MARKETPRO_REQUIRE_STABLE_SIGNING: 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :stagingMarket:assembleRelease
      - name: Verify release APK signature and version
        run: |
          APK="$(find stagingMarket/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='lk.peliyagoda.marketpro.staging.fullapp' versionCode='448' versionName='4.4.8'"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: marketpro-v448-signed-candidate
          path: |
            stagingMarket/build/outputs/apk/release/*.apk
            stagingMarket/build/outputs/apk/release/*.sha256
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/marketpro-stable.jks"











  publish-verified-v448:
    if: github.event_name == 'pull_request'
    needs: [android-qa, signed-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marketpro-v448-signed-candidate
          path: candidate
      - name: Verify signed release identity
        run: |
          set -euo pipefail
          APK="$(find candidate -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='lk.peliyagoda.marketpro.staging.fullapp' versionCode='448' versionName='4.4.8'"
          cp "$APK" MarketPro-v4.4.8-stable-signed.apk
      - name: Publish versioned signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=marketpro-stable-signed-v4.4.8
          if gh release view "$TAG" -R Shanawebs/peliyagoda-market-v2 >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release"
            exit 1
          fi
          gh release create "$TAG" MarketPro-v4.4.8-stable-signed.apk -R Shanawebs/peliyagoda-market-v2 --title "Market Pro v4.4.8 Five Subs Manager" --notes "Signed in-place update: Owner Manage Subs (up to five distinct verified accounts), MFA-verified enrollment and secure approved writer-per-account policy. Current Admin and Subs records preserved." --prerelease
      - name: Verify GitHub download exactly matches signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh release download marketpro-stable-signed-v4.4.8 -R Shanawebs/peliyagoda-market-v2 --pattern 'MarketPro-v4.4.8-stable-signed.apk' --dir verified
          cmp MarketPro-v4.4.8-stable-signed.apk verified/MarketPro-v4.4.8-stable-signed.apk
          echo "PUBLIC_SHA256=$(sha256sum verified/MarketPro-v4.4.8-stable-signed.apk | cut -d ' ' -f 1)"
          echo "PUBLIC_BYTES=$(stat -c %s verified/MarketPro-v4.4.8-stable-signed.apk)"
