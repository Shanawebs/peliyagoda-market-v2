name: Cloud V1 - Supabase DB Security Tests

on:
  push:
    branches:
      - feature/cloud-v1-v228-foundation
    paths:
      - 'supabase/**'
      - '.github/workflows/cloud-v1-db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    name: Local migration and RLS tests (no hosted DB changes)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Cloud V1 branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable Supabase local stack and apply migrations
        run: supabase start

      - name: Run pgTAP workspace isolation and SQL security tests
        run: supabase test db

      - name: Lint local PostgreSQL database
        run: supabase db lint

      - name: Stop disposable local stack
        if: always()
        run: supabase stop --no-backup || true
