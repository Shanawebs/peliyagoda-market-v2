name: Publish Market Pro v4.3.6 Date Cloud Gallery In-App Update

on:
  push:
    branches:
      - feature/marketpro-v436-item-card-date-gallery-qa
    paths:
      - .github/workflows/marketpro-v436-publish-inapp-update.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: marketpro-v436-inapp-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.MARKETPRO_RELEASE_PAT || github.token }}
      SOURCE_RUN: '40924635147'
      SOURCE_SHA: 5bef1c6a40ce0261ae17e11f9c27f7022b840d60
      SOURCE_ARTIFACT: MarketPro-v4.3.6-DateGallery-Signed-QA-NOT-RELEASE
      SOURCE_APK: MarketPro-v4.3.6-DateGallery-QA-signed.apk
      APK: MarketPro-v4.3.6-signed.apk
      TAG: marketpro-date-gallery-v4.3.6
      OLD_TAG: marketpro-itemcard-photos-v4.3.4
      OLD_APK: MarketPro-v4.3.4-signed.apk
      EXPECTED_PACKAGE: lk.peliyagoda.marketpro.staging.fullapp
      EXPECTED_CERT: 0a617edb7520deb0255cfc13ee0b2ee8382e2d8e6cb7f8e1dff68b4fbd130c4a

    steps:
      - name: Wait for the pinned signed QA run and check it passed
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          ACTUAL_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.conclusion')"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          test "$CONCLUSION" = success

      - name: Obtain exact QA-verified signed APK (never rebuild it)
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir .
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK"

      - name: Install APK verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Verify v4.3.6 APK certificate, identity and in-place version upgrade
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" > /tmp/mp-new-badging
          grep -Fq "package: name='$EXPECTED_PACKAGE'" /tmp/mp-new-badging
          grep -Fq "versionCode='436'" /tmp/mp-new-badging
          grep -Fq "versionName='4.3.6'" /tmp/mp-new-badging
          ! grep -Fq 'application-debuggable' /tmp/mp-new-badging
          "$SIGNER" verify --print-certs "$APK" > /tmp/mp-new-cert
          grep -Fqi "$EXPECTED_CERT" /tmp/mp-new-cert
          mkdir -p /tmp/marketpro-previous
          gh release download "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$OLD_APK" --dir /tmp/marketpro-previous
          "$AAPT" dump badging "/tmp/marketpro-previous/$OLD_APK" > /tmp/mp-old-badging
          grep -Fq "package: name='$EXPECTED_PACKAGE'" /tmp/mp-old-badging
          grep -Fq "versionCode='434'" /tmp/mp-old-badging
          "$SIGNER" verify --print-certs "/tmp/marketpro-previous/$OLD_APK" > /tmp/mp-old-cert
          NEW_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/mp-new-cert | head -n1)"
          OLD_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/mp-old-cert | head -n1)"
          test -n "$NEW_CERT" && test "$NEW_CERT" = "$OLD_CERT"
          sha256sum "$APK"
          test "$(sha256sum "$APK" | cut -d ' ' -f1)" = "9715474b12528e677f2c51b0300940d499a8a8eea0397cddeeba69d641c4a17f"

      - name: Publish a new immutable-name v4.3.6 release for in-app updates
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing overwrite"
            exit 1
          fi
          cat > /tmp/marketpro-v436-release-notes.md <<'NOTES'
          # Market Pro v4.3.6 — Date-wide Cloud Gallery QA

          Install through Market Pro → Menu → Check For Updates.
          Keep phone credentials; do NOT uninstall or clear app storage.
          - Restores View All Cloud Photos For This Date in Item Photos popup.
          - Date-wide signed read-only Box Gallery displays ALL uploaded items
            with Previous / Next date, Refresh and original photo preview.
          - Preserves dynamic Camera / Photo icons, Item-specific Cloud Photos,
            and the 60-second Completed item list sorting.
          - Owner and approved Team phone security remains unchanged.
          - Automatic photo upload stays PAUSED for Samsung recovery safety.
          - Signed Android QA and stable in-place upgrade tests passed;
            Owner and Team phone field QA remains necessary.
          NOTES
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --prerelease \
            --title 'Market Pro v4.3.6 — Date Cloud Gallery QA' \
            --notes-file /tmp/marketpro-v436-release-notes.md

      - name: Verify uploaded APK digest and length against signed QA original
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="sha256:$(sha256sum "$APK" | cut -d' ' -f1)"
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="MarketPro-v4.3.6-signed.apk") | .digest')"
          SIZE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="MarketPro-v4.3.6-signed.apk") | .size')"
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED"
          test "$SIZE" = "$(stat -c%s "$APK")"
          echo "Verified APK: $EXPECTED"
